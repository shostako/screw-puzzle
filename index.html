<title>ネジ外し工房</title>

<style>
  /* 木の作業台の上で遊ぶ単一テーマ。背景の木目は起動時に描いて body に貼る */
  :root {
    color-scheme: dark;
    --wood: #8a4a1d;
    --wood-edge: #5a2f0f;
    --wood-shadow: #4a260c;
    --ink: #ffffff;
    --ink-edge: #4a2408;
    --gold: #ffc93c;
    --go: #4cc94a;
    --go-deep: #2b8a2a;
    --round: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
  }
  html, body { height: 100%; margin: 0; }
  body {
    background-color: var(--wood);
    background-size: cover;
    background-position: center;
    color: var(--ink);
    font-family: var(--round);
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #app {
    height: 100%;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    padding-inline: 16px;
    padding-block: 10px 8px;
    gap: 4px;
  }
  #hud {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    max-width: 420px;
    width: 100%;
    margin-inline: auto;
  }
  .outlined {
    text-shadow:
      2px 0 0 var(--ink-edge), -2px 0 0 var(--ink-edge), 0 2px 0 var(--ink-edge), 0 -2px 0 var(--ink-edge),
      1.5px 1.5px 0 var(--ink-edge), -1.5px 1.5px 0 var(--ink-edge), 1.5px -1.5px 0 var(--ink-edge), -1.5px -1.5px 0 var(--ink-edge),
      0 4px 0 rgba(40, 16, 2, 0.45);
  }
  #title {
    display: flex;
    flex-direction: column;
    align-items: center;
    line-height: 1.1;
    font-weight: 800;
    font-size: 24px;
    letter-spacing: 0.04em;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .tools { justify-self: start; display: flex; gap: 8px; }
  .woodbtn {
    width: 42px;
    height: 42px;
    padding: 0;
    border-radius: 50%;
    border: 3px solid var(--wood-edge);
    background: radial-gradient(circle at 40% 35%, #f0b46a, #c9803d 60%, #a9652a);
    box-shadow: 0 3px 0 var(--wood-shadow), inset 0 2px 0 rgba(255, 255, 255, 0.35);
    display: grid;
    place-items: center;
    cursor: pointer;
  }
  .woodbtn svg { width: 22px; height: 22px; }
  .woodbtn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--wood-shadow), inset 0 2px 0 rgba(255, 255, 255, 0.35); }
  .woodbtn:focus-visible, #mBtn:focus-visible, .pickbtn:focus-visible, .subbtn:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
  #prog {
    justify-self: end;
    display: flex;
    align-items: center;
    gap: 6px;
    font-weight: 800;
    font-size: 20px;
    font-variant-numeric: tabular-nums;
  }
  .coin {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff3b0, var(--gold) 45%, #e09a12);
    box-shadow: 0 2px 0 #8a5600, inset 0 0 0 2px rgba(150, 90, 0, 0.5);
  }
  #stage {
    position: relative;
    flex: 1;

  canvas { display: block; touch-action: none; }
  #tSub { font-size: 12px; font-weight: 700; letter-spacing: 0.06em; }
  #modal, #pick {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    background: rgba(35, 14, 2, 0.55);
  }
  #modal[hidden], #pick[hidden] { display: none; }
  #modal .card, #pick .card {
    background: linear-gradient(#e2a563, #c47f3e);
    border: 4px solid var(--wood-edge);
    border-radius: 22px;
    box-shadow: 0 6px 0 var(--wood-shadow), inset 0 3px 0 rgba(255, 255, 255, 0.35);
    padding: 22px 28px 24px;
    text-align: center;
    display: grid;
    gap: 12px;
    min-width: 230px;
  }
  #mTitle { margin: 0; font-weight: 800; font-size: 34px; letter-spacing: 0.06em; }
  #mSub { margin: 0; color: var(--ink-edge); font-weight: 700; font-size: 14px; }
  #mBtn {
    font: inherit;
    font-weight: 800;
    font-size: 18px;
    color: var(--ink);
    text-shadow: 0 2px 0 var(--go-deep);
    background: linear-gradient(#78e063, var(--go));
    border: 3px solid var(--go-deep);
    border-radius: 999px;
    box-shadow: 0 4px 0 var(--go-deep);
    padding: 10px 22px;
    cursor: pointer;
  }
  #mBtn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--go-deep); }
  .subbtn {
    font: inherit;
    font-weight: 800;
    font-size: 15px;
    color: var(--ink-edge);
    background: rgba(255, 244, 225, 0.55);
    border: 3px solid var(--wood-edge);
    border-radius: 999px;
    padding: 8px 18px;
    cursor: pointer;
  }
  .pickHead { margin: 0; font-weight: 800; font-size: 30px; letter-spacing: 0.06em; }
  #pickNote { margin: 0; color: var(--ink-edge); font-weight: 700; font-size: 13px; }
  .pickbtn {
    font: inherit;
    font-weight: 800;
    font-size: 18px;
    color: var(--ink);
    text-shadow: 0 2px 0 var(--wood-shadow);
    background: linear-gradient(#f0a95c, #d0802f);
    border: 3px solid var(--wood-edge);
    border-radius: 16px;
    box-shadow: 0 4px 0 var(--wood-shadow);
    padding: 8px 18px;
    display: grid;
    gap: 2px;
    cursor: pointer;
  }
  .pickbtn small { font-size: 12px; font-weight: 700; text-shadow: none; color: #fff4dc; }
  .pickbtn.on { background: linear-gradient(#78e063, var(--go)); border-color: var(--go-deep); box-shadow: 0 4px 0 var(--go-deep); }
  .pickbtn:active, .subbtn:active { transform: translateY(3px); }
  @media (prefers-reduced-motion: reduce) {
    .woodbtn:active, #mBtn:active, .pickbtn:active, .subbtn:active { transform: none; }
  }
</style>

<script>
(() => {
  const { Engine, Bodies, Body, Composite, Constraint, Vertices, Common } = Matter;
  Common.setDecomp(window.decomp);

  // ---- 定数 ----
  const W = 400, H = 716;
  const TAU = Math.PI * 2, DEG = Math.PI / 180;
  const SR = 13;          // ねじ半径
  const HR = 11.5;        // 板のねじ穴の半径
  const GAP = 34;         // ねじ同士の最小間隔(中心間)
  const EDGE = 20;        // ねじ穴の中心から板の縁までに残す幅
  const LINE = 3.8;       // 板の縁取りの太さ
  const ACTIVE = 2;       // 同時に出る箱の数
  const BUF = 5;          // 待機スロット数
  const FLY = 0.38;       // ねじが飛ぶ時間(秒)
  const NUDGE_W = 0.004;  // 倒立の釣り合いから押し出すときの最低回転速度(rad/ステップ、約0.24rad/秒)
  const NUDGE_ANGLE = 0.3;  // この角度だけ傾いたら押すのをやめ、あとは重力に任せる(rad)
  const BOARD = { x0: 8, x1: 392, y0: 164, y1: 710 };   // 板を置いてよい範囲
  const COLOR_DEPTH = 5;  // 最上階層から何段目までねじの色が見え、触れるか
  const SHAPE_DEPTH = 6;  // 何段目まで板の形が見えるか(6段目は形だけで、ねじの色は分からない)
  const TIER_GAP = 6;     // 同じ階層の板どうしのすき間。同じ階層の板は衝突するので重ねて置かない
  const MAX_PLATES = 36;  // 1ステージの板の上限
  const MAX_HOLES = 4;    // 1枚の板のねじ穴の上限(ねじの総数を抑えつつ階層を増やす)
  const SCREW_CAP = 75;   // 1ステージのねじの上限
  const colorsFor = lv => Math.min(5 + Math.floor((lv - 1) / 3), 9);   // ねじの色数: ステージ1〜3で5色、3ステージごとに+1、13以降9色(用意は10色)
  const tierGoal = lv => Math.min(7 + Math.floor((lv - 1) / 3), 9);    // 階層の目標段数(ステージ1〜3で7段、4〜6で8段、7以降9段。ねじ60本前後で盤面が埋まるので10段以上は入りにくい)
  const DENSITY = 0.001, INERTIA_SCALE = 4;              // Matter.js の既定値(密度、慣性モーメントの倍率)に合わせる

  const COLORS = [
    { c: '#3fd46a', d: '#12813a' },   // 緑
    { c: '#2ec4f1', d: '#0a6d95' },   // 水色
    { c: '#f04fae', d: '#961866' },   // 桃
    { c: '#ffd23c', d: '#b07f00' },   // 黄
    { c: '#ff8a2a', d: '#ad4805' },   // 橙
    { c: '#ef3f4e', d: '#93121e' },   // 赤
    { c: '#9d64f0', d: '#5627a6' },   // 紫
    { c: '#b7bcc4', d: '#5b6069' },   // 銀
    { c: '#4668f0', d: '#1c3499' },   // 青
    { c: '#b8804a', d: '#6a4219' },   // 茶
  ];
  const TINTS = ['#9b5de5', '#f0648f', '#f7924f', '#9bd34d', '#4fb8f0', '#f5cf43', '#45d1a8', '#b98af0'];

  const BOX_Y = 60, BUF_Y = 134;
  const boxX = i => 200 + (i - (ACTIVE - 1) / 2) * 128;
  const SLOT = [[0, -8.5], [-17, 14.5], [17, 14.5]];      // 箱の中の3つの穴(三角配置)
  const bufX = i => 200 + (i - (BUF - 1) / 2) * 34;

  const hex = s => [1, 3, 5].map(i => parseInt(s.slice(i, i + 2), 16));
  const mix = (a, b, t) => { const A = hex(a), B = hex(b); return `rgb(${A.map((v, i) => Math.round(v + (B[i] - v) * t)).join(',')})`; };
  COLORS.forEach(C => { C.l = mix(C.c, '#ffffff', 0.45); C.m = mix(C.c, C.d, 0.5); });

  // ---- 状態 ----
  let engine, planks, screws, boxes, buffer, queue, level, ended, flashBuf;
  let stuckT = 0;          // 詰みの状態が続いている秒数
  const STUCK_HOLD = 0.8;
  let genStats = null;   // 直近の盤面生成で、色の割り当てを何回やり直したか(確認用)

  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const stage = document.getElementById('stage');
  let scale = 1, dpr = 1;

  // ---- 乱数 ----
  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function shuffle(arr, rnd) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(rnd() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }
  const U = (rnd, a, b) => a + rnd() * (b - a);
  const len = (x, y) => Math.sqrt(x * x + y * y);
  const rot = (x, y, a) => {
    const c = Math.cos(a), s = Math.sin(a);
    return { x: x * c - y * s, y: x * s + y * c };
  };

  // ---- 板の形: 符号付き距離関数(内側が負) ----
  function sdSeg(px, py, ax, ay, bx, by) {
    const wx = px - ax, wy = py - ay, ex = bx - ax, ey = by - ay;
    const t = Math.max(0, Math.min(1, (wx * ex + wy * ey) / (ex * ex + ey * ey)));
    return len(wx - ex * t, wy - ey * t);
  }
  function smin(a, b, k) {
    const h = Math.max(k - Math.abs(a - b), 0) / k;
    return Math.min(a, b) - h * h * k * 0.25;
  }
  function sdPoly(px, py, v) {
    let d = Infinity, s = 1;
    for (let i = 0, j = v.length - 1; i < v.length; j = i++) {
      const ex = v[j][0] - v[i][0], ey = v[j][1] - v[i][1];
      const wx = px - v[i][0], wy = py - v[i][1];
      const t = Math.max(0, Math.min(1, (wx * ex + wy * ey) / (ex * ex + ey * ey)));
      const bx = wx - ex * t, by = wy - ey * t;
      d = Math.min(d, bx * bx + by * by);
      const c1 = py >= v[i][1], c2 = py < v[j][1], c3 = ex * wy > ey * wx;
      if ((c1 && c2 && c3) || (!c1 && !c2 && !c3)) s = -s;
    }
    return s * Math.sqrt(d);
  }
  // 太さ r の円弧(端は丸い)。中心は原点、半径 R、+x 軸から ±half
  function sdArc(px, py, R, half, r) {
    const qy = Math.abs(py);
    if (Math.atan2(qy, px) <= half) return Math.abs(len(px, qy) - R) - r;
    return len(px - R * Math.cos(half), qy - R * Math.sin(half)) - r;
  }
  // 扇形(内径 r1、外径 r2、+x 軸から ±half)。r1 = 0 ならパイ形
  function sdSector(px, py, r1, r2, half) {
    const qy = Math.abs(py), rho = len(px, qy), inArc = Math.atan2(qy, px) <= half;
    const ux = Math.cos(half), uy = Math.sin(half);
    const d1 = inArc ? Math.abs(rho - r2) : len(px - r2 * ux, qy - r2 * uy);
    const d2 = r1 > 0 ? (inArc ? Math.abs(rho - r1) : len(px - r1 * ux, qy - r1 * uy)) : rho;
    const d3 = sdSeg(px, qy, r1 * ux, r1 * uy, r2 * ux, r2 * uy);
    const d = Math.min(d1, d2, d3);
    return inArc && rho >= r1 && rho <= r2 ? -d : d;
  }
  // しずく形: 原点の半径 r1 の円と、+x 方向 h 先の半径 r2 の円を接線でつないだ形
  function sdTear(px, py, r1, r2, h) {
    const x = Math.abs(py), y = px;
    const b = (r1 - r2) / h, a = Math.sqrt(1 - b * b);
    const k = -b * x + a * y;
    if (k < 0) return len(x, y) - r1;
    if (k > a * h) return len(x, y - h) - r2;
    return x * a + y * b - r1;
  }
  const boxOf = (pts, r) => [
    Math.min(...pts.map(p => p[0])) - r, Math.min(...pts.map(p => p[1])) - r,
    Math.max(...pts.map(p => p[0])) + r, Math.max(...pts.map(p => p[1])) + r,
  ];

  // 半径 R の円弧上 ±amax に、間隔 sp を目安に穴を並べる(最大 max 個)
  function arcHoles(R, amax, sp, max) {
    if (amax <= 0) return [[R, 0]];
    const n = Math.max(2, Math.min(max, Math.floor(2 * amax * R / sp) + 1));
    const out = [];
    for (let i = 0; i < n; i++) {
      const a = -amax + 2 * amax * i / (n - 1);
      out.push([R * Math.cos(a), R * Math.sin(a)]);
    }
    return out;
  }

  // 形の種類。w は出やすさ、cut は飾り穴を開けてよいか
  const SHAPES = [
    { w: 2, cut: false, make: rnd => {   // 棒
      const r = U(rnd, 22, 27), L = U(rnd, 70, 175);
      const n = Math.min(4, Math.floor(L / 46) + 1);
      const holes = [];
      for (let i = 0; i < n; i++) holes.push([-L / 2 + L * i / (n - 1), 0]);
      return { f: (x, y) => sdSeg(x, y, -L / 2, 0, L / 2, 0) - r, holes, box: [-L / 2 - r, -r, L / 2 + r, r] };
    } },
    { w: 2.5, cut: false, make: rnd => { // 円弧(バナナ形〜C字)
      const ring = rnd() < 0.35;
      const R = ring ? U(rnd, 46, 62) : U(rnd, 62, 120);
      const half = (ring ? U(rnd, 110, 132) : U(rnd, 40, 85)) * DEG;
      const r = U(rnd, 22, 26);
      return { f: (x, y) => sdArc(x, y, R, half, r), holes: arcHoles(R, half, 52, 5), box: [-R - r, -R - r, R + r, R + r] };
    } },
    { w: 3.5, cut: true, make: rnd => {  // 扇(角は丸める)。大きいものは穴を2〜3列
      const pie = rnd() < 0.3;
      const half = (pie ? U(rnd, 45, 88) : U(rnd, 35, 72)) * DEG;
      const r1 = pie ? 0 : U(rnd, 22, 55);
      const r2 = r1 + (pie ? U(rnd, 85, 125) : U(rnd, 70, 110));
      const rc = 9, h2 = half - rc / ((r1 + r2) / 2);
      const f = (x, y) => sdSector(x, y, r1 ? r1 + rc : 0, r2 - rc, h2) - rc;
      const rows = [r2 - 25], lo = r1 ? r1 + 25 : 36;
      if (rows[0] - lo >= 46) rows.push(lo);
      if (rows[0] - lo >= 100) rows.push((rows[0] + lo) / 2);
      const holes = [];
      for (const rh of rows) holes.push(...arcHoles(rh, half - Math.asin(Math.min(1, 25 / rh)), 50, 5));
      return { f, holes, box: [-r2, -r2, r2, r2] };
    } },
    { w: 1, cut: false, make: rnd => {   // しずく
      const r1 = U(rnd, 32, 42), r2 = U(rnd, 10, 16), h = U(rnd, 72, 108);
      const f = (x, y) => sdTear(x, y, r1, r2, h);
      let t = 0;
      for (let s = GAP; s < h; s++) if (f(s, 0) <= -EDGE) t = s;
      return { f, holes: t ? [[0, 0], [t, 0]] : [[0, 0]], box: [-r1, -r1, h + r2, r1] };
    } },
    { w: 2.5, cut: true, make: rnd => {  // 円をなめらかにつないだ塊
      const n = 2 + Math.floor(rnd() * 4);
      const cs = [{ x: 0, y: 0, r: U(rnd, 28, 40) }];
      let dir = rnd() * TAU;
      for (let i = 1; i < n; i++) {
        const prev = cs[i - 1], r = U(rnd, 28, 40);
        let ok = null;
        for (let k = 0; k < 12 && !ok; k++) {
          const a = dir + U(rnd, -1.3, 1.3), st = U(rnd, 46, Math.min(66, prev.r + r - 8));
          const c = { x: prev.x + Math.cos(a) * st, y: prev.y + Math.sin(a) * st, r };
          if (cs.every(o => len(o.x - c.x, o.y - c.y) >= 46)) { ok = c; dir = a; }
        }
        if (!ok) break;
        cs.push(ok);
      }
      const f = (x, y) => {
        let d = len(x - cs[0].x, y - cs[0].y) - cs[0].r;
        for (let i = 1; i < cs.length; i++) d = smin(d, len(x - cs[i].x, y - cs[i].y) - cs[i].r, 20);
        return d;
      };
      return { f, holes: cs.map(c => [c.x, c.y]), box: boxOf(cs.map(c => [c.x, c.y]), 44) };
    } },
    { w: 1.5, cut: false, make: rnd => { // くの字。腕が長ければ途中にも穴
      const b = U(rnd, 70, 135) * DEG / 2;
      const L1 = U(rnd, 60, 100), L2 = U(rnd, 60, 100), r = U(rnd, 23, 30);
      const A = [L1 * Math.cos(b), L1 * Math.sin(b)], C = [L2 * Math.cos(b), -L2 * Math.sin(b)];
      const f = (x, y) => smin(sdSeg(x, y, 0, 0, A[0], A[1]), sdSeg(x, y, 0, 0, C[0], C[1]), 12) - r;
      const holes = [A, [0, 0], C];
      if (L1 >= 90) holes.push([A[0] / 2, A[1] / 2]);
      if (L2 >= 90) holes.push([C[0] / 2, C[1] / 2]);
      return { f, holes, box: boxOf([A, [0, 0], C], r + 4) };
    } },
    { w: 3, cut: true, make: rnd => {    // 角の丸い多角形(3〜6角)。頂点に穴、ときどき中心にも
      const k = 3 + Math.floor(rnd() * 4);
      const cr = U(rnd, Math.max(42, 24 / Math.sin(Math.PI / k)), 70), a0 = rnd() * TAU;
      const sx = k === 4 ? U(rnd, 0.8, 1.3) : 1;
      const v = [];
      for (let i = 0; i < k; i++) {
        const a = a0 + i * TAU / k + U(rnd, -0.15, 0.15), rr = cr * U(rnd, 0.92, 1.08);
        v.push([Math.cos(a) * rr * sx, Math.sin(a) * rr]);
      }
      const r = U(rnd, 22, 27);
      const holes = v.map(p => p.slice());
      if (rnd() < 0.5) holes.push([0, 0]);
      return { f: (x, y) => sdPoly(x, y, v) - r, holes, box: boxOf(v, r) };
    } },
  ];

  function makeShape(rnd) {
    let t = rnd() * SHAPES.reduce((s, k) => s + k.w, 0), kind = SHAPES[0];
    for (const k of SHAPES) { if ((t -= k.w) < 0) { kind = k; break; } }
    const sh = kind.make(rnd);
    // ねじ穴は板の縁から EDGE 以上内側、互いに GAP 以上離す
    const holes = [];
    for (const h of sh.holes) {
      if (sh.f(h[0], h[1]) > -EDGE + 0.5) continue;
      if (holes.some(o => len(o[0] - h[0], o[1] - h[1]) < GAP)) continue;
      holes.push(h);
    }
    if (holes.length < 2) return null;
    sh.holes = holes.slice(0, MAX_HOLES);
    if (kind.cut && rnd() < 0.5) addCutouts(sh, rnd);
    return sh;
  }
  // 飾りの丸穴(下の板が透けて見える)。ねじ穴と板の縁からは離す
  function addCutouts(sh, rnd) {
    const cuts = [], [x0, y0, x1, y1] = sh.box;
    for (let k = 0; k < 40 && cuts.length < 2; k++) {
      const r = U(rnd, 11, 19), x = U(rnd, x0, x1), y = U(rnd, y0, y1);
      if (sh.f(x, y) > -(r + 9)) continue;
      if (sh.holes.some(h => len(h[0] - x, h[1] - y) < r + SR + 9)) continue;
      if (cuts.some(c => len(c.x - x, c.y - y) < c.r + r + 10)) continue;
      cuts.push({ x, y, r });
    }
    if (!cuts.length) return;
    const f0 = sh.f;
    sh.f = (x, y) => {
      let d = f0(x, y);
      for (const c of cuts) d = Math.max(d, c.r - len(x - c.x, y - c.y));
      return d;
    };
  }

  // ねじの縁まで含めた被り判定用の点(中心＋外周16点)
  const RING = [[0, 0]];
  for (let k = 0; k < 16; k++) RING.push([Math.cos(k * TAU / 16) * (SR + 1), Math.sin(k * TAU / 16) * (SR + 1)]);
  const covers = (f, x, y) => RING.some(([ox, oy]) => f(x + ox, y + oy) < 0);

  // ---- ステージ生成 ----
  // 形を1枚ずつ作って盤面に置く。後から置いた板ほど上の層になり、下の板のねじを隠す。
  const place = (pl, x, y) => {
    const c = Math.cos(pl.ang), s = Math.sin(pl.ang);
    return [pl.x + x * c - y * s, pl.y + x * s + y * c];
  };
  const unplace = (pl, x, y) => {
    const dx = x - pl.x, dy = y - pl.y, c = Math.cos(pl.ang), s = Math.sin(pl.ang);
    return [dx * c + dy * s, -dx * s + dy * c];
  };
  function coarse(sh) {
    const pts = [], [x0, y0, x1, y1] = sh.box;
    for (let y = y0; y <= y1; y += 7) for (let x = x0; x <= x1; x += 7) if (sh.f(x, y) < 0) pts.push([x, y]);
    return pts;
  }
  function fits(pl, pts, plates, maxCover, rnd) {
    const wp = pts.map(p => place(pl, p[0], p[1]));
    if (wp.some(([x, y]) => x < BOARD.x0 || x > BOARD.x1 || y < BOARD.y0 || y > BOARD.y1)) return false;
    const hw = pl.sh.holes.map(h => place(pl, h[0], h[1]));
    for (const q of plates) for (const a of q.holesW) for (const b of hw) {
      if (len(a[0] - b[0], a[1] - b[1]) < GAP) return false;
    }
    // 同じ階層の板とは重ねず、すき間も空ける(あとで衝突させる)
    const inside = (q, x, y) => { const l = unplace(q, x, y); return q.sh.f(l[0], l[1]) < TIER_GAP; };
    for (const q of plates) {
      if (q.tb !== pl.tb) continue;
      if (wp.some(([x, y]) => inside(q, x, y)) || q.wp.some(([x, y]) => inside(pl, x, y))) return false;
    }
    const lower = plates.filter(q => q.tb < pl.tb);
    if (!lower.length) return true;          // 一番下の階層には重ねる相手がいない
    // 下の階層の板とほどよく重ねる(離れ小島にも、べったり覆うのにもしない)
    let over = 0;
    for (const [x, y] of wp) {
      if (lower.some(q => { const l = unplace(q, x, y); return q.sh.f(l[0], l[1]) < 0; })) over++;
    }
    const frac = over / wp.length;
    if (frac < 0.15 || frac > 0.8) return false;
    let cov = 0;
    for (const q of lower) for (const a of q.holesW) {
      const l = unplace(pl, a[0], a[1]);
      if (covers(pl.sh.f, l[0], l[1])) cov++;
    }
    if (cov > maxCover) return false;
    if (cov === 0 && lower.length >= 2 && rnd() < 0.7) return false;
    return true;
  }

  // 板を下の階層から置いていき、ねじの総数を3の倍数にそろえる。tb は下から数えた階層。
  // 階層ごとに枚数(序盤は2枚、ステージ4からは2〜3枚)を先に決め、その枚数まで形と位置を変えて粘る
  function placePlates(lv, rnd) {
    const maxCover = Math.min(3 + Math.floor(lv / 3), 6);
    const goal = tierGoal(lv);
    const plates = [];
    let S = 0, tb = 0, emptyTiers = 0;
    while (tb < goal && S < SCREW_CAP && plates.length < MAX_PLATES && emptyTiers < 6) {
      const want = 2 + (lv >= 4 && rnd() < 0.5 ? 1 : 0);
      let placed = 0, misses = 0;
      // ねじの上限に達しても、階層は最低2枚まで埋める
      while (placed < want && (S < SCREW_CAP || placed < 2) && plates.length < MAX_PLATES && misses < 14) {
        const sh = makeShape(rnd);
        if (!sh) { misses++; continue; }
        const pts = coarse(sh);
        let ok = null;
        for (let k = 0; k < 24 && !ok; k++) {
          const spread = !plates.length ? 0.3 : tb === 0 ? 0.7 : 1;
          const pl = { sh, tb, ang: rnd() * TAU, x: 200 + (rnd() * 2 - 1) * 130 * spread, y: 437 + (rnd() * 2 - 1) * 190 * spread };
          if (fits(pl, pts, plates, maxCover, rnd)) ok = pl;
        }
        if (!ok) { misses++; continue; }
        ok.holesW = sh.holes.map(h => place(ok, h[0], h[1]));
        ok.wp = pts.map(p => place(ok, p[0], p[1]));
        plates.push(ok);
        placed++;
        S += sh.holes.length;
      }
      if (placed === 1) {                        // 1枚しか入らなかった階層は取り消す(一番下の階層も)
        S -= plates.pop().sh.holes.length;
        placed = 0;
      }
      if (placed) { tb++; emptyTiers = 0; } else emptyTiers++;
    }
    // ねじの総数を、上限以下の3の倍数にそろえる(穴の多い板から1つずつ減らす)
    while (S % 3 !== 0 || S > SCREW_CAP) {
      let best = null;
      for (const p of plates) if (p.sh.holes.length > 2 && (!best || p.sh.holes.length > best.sh.holes.length)) best = p;
      if (best) { best.sh.holes.pop(); best.holesW.pop(); S--; }
      else if (S % 3 !== 0 && plates.length > 1) S -= plates.pop().sh.holes.length;
      else break;
    }
    return { plates, S, tiers: new Set(plates.map(p => p.tb)).size };
  }

  function genLevel(lv, seed) {
    // 配置が早く行き詰まって目標の段数に届かなかったら、種を変えて作り直す(同じ番号なら同じ盤面)
    const goal = tierGoal(lv);
    let pick = null, last = null;
    for (let k = 0; k < 8; k++) {
      const rnd = mulberry32(seed + k * 104729);
      const g = placePlates(lv, rnd);
      g.rnd = rnd;
      last = g;
      const ok = g.S % 3 === 0 && g.S >= 9 && g.plates.length >= 3;
      if (ok && (!pick || g.tiers > pick.tiers || (g.tiers === pick.tiers && g.S > pick.S))) pick = g;
      if (pick && pick.tiers >= goal) break;
    }
    const { plates, S, rnd } = pick || last;
    // 階層は上から 0, 1, 2 …(空いた階層は詰める)
    const tbs = [...new Set(plates.map(p => p.tb))].sort((a, b) => b - a);
    plates.forEach(p => { p.tier = tbs.indexOf(p.tb); });
    const nColors = colorsFor(lv);

    // 箱の順番を先に決め、上の階層のねじほど早い箱の色になるよう、階層をまたいで混ぜながら割り当てる。
    // 解ける手順があり、しかも手なりでは解けない割り当てを探す(ステージが進むほど厳しく)
    const palette = shuffle(COLORS.map((_, i) => i), rnd).slice(0, nColors);
    const boxQueue = [];
    for (let i = 0; i < S / 3; i++) boxQueue.push(palette[i % nColors]);
    shuffle(boxQueue, rnd);
    const list = [];
    plates.forEach((p, li) => p.sh.holes.forEach((h, hi) => list.push({ pl: li, hi, tier: p.tier, x: p.holesW[hi][0], y: p.holesW[hi][1] })));
    const cov = buildModel(plates, list);
    const hard = lv >= 5 ? 2 : lv >= 2 ? 1 : 0;   // 0: 解ければよい 1: 上から順に外すだけでは解けない 2: さらに手なりでも解けない
    const win = Math.min(5 + lv, 14), noise = Math.min(1.5 + lv * 0.1, 3);
    let choice = null, spare = null, tries = 0;
    for (; tries < TRY_ASSIGN && !choice; tries++) {
      assignColors(list, boxQueue, win, noise, rnd);
      const easy = (hard >= 1 && solvable(list, boxQueue)) || (hard >= 2 && greedyPlay(plates, list, boxQueue, cov));
      if (easy && spare) continue;               // 易しい割り当ての控えは1つで足りる
      const path = solveFull(plates, list, boxQueue, cov, SOLVE_BUDGET);
      if (!path) continue;
      const rec = { colors: list.map(x => x.color), path, easy };
      if (easy) spare = rec; else choice = rec;
    }
    if (!choice) choice = spare;
    if (!choice) {                                  // 最後の砦: 混ぜない割り当て。上から順に外すだけで必ず解ける
      assignColors(list, boxQueue, 1, 0, rnd);
      choice = { colors: list.map(x => x.color), path: solveOrder(list, boxQueue), easy: true, fallback: true };
    }
    list.forEach((x, i) => { x.color = choice.colors[i]; });
    genStats = { tries, hard, easy: choice.easy, fallback: !!choice.fallback, path: choice.path };
    const tints = shuffle(TINTS.slice(), rnd);                 // 同じ階層の板は同じ色
    plates.forEach(p => { p.tint = tints[p.tier % tints.length]; });
    return { plates, screws: list, queue: boxQueue, rnd };
  }

  // 箱の色の並び(1箱3本)を窓の中で混ぜ、上の階層ほど前の色を割り当てる。noise は階層をまたぐ混ざり具合
  function assignColors(list, queue, win, noise, rnd) {
    const L = queue.flatMap(c => [c, c, c]);
    for (let i = 0; i < L.length; i++) {
      const j = i + Math.floor(rnd() * Math.min(win, L.length - i));
      [L[i], L[j]] = [L[j], L[i]];
    }
    for (const s of list) s.key = -s.tier + rnd() * noise;
    list.slice().sort((a, b) => b.key - a.key).forEach((s, i) => { s.color = L[i]; });
  }

  // ---- 解けるかの判定 ----
  // 「最上階層のねじから順に外す」手順だけを試す。この手順で外すねじは常に最上階層にあり、
  // 上の階層はねじ0本で板が落ちていくだけなので、板がどう揺れても隠れず、色も見えている(物理に左右されない)。
  // 揺れている板の下を先に掘れるかどうかは揺れ方しだいの近道なので、判定には使わない。
  // 各階層の中では、合う箱があるねじを先に入れ、無ければ次に出る箱で一番早く要る色を待機スロットへ置く。
  // 待機スロットがあふれずに全部の箱が埋まれば解ける。実際のゲームでもこの順に外せば必ずクリアできる
  function solveOrder(list, queue) {
    const tiers = [];
    list.forEach((s, i) => { (tiers[s.tier] = tiers[s.tier] || []).push(i); });
    const q = queue.slice(), boxes = [], buf = [], order = [];
    const spawn = () => {
      while (boxes.length < ACTIVE && q.length) {
        const b = { color: q.shift(), n: 0 };
        boxes.push(b);
        for (let i = buf.length - 1; i >= 0 && b.n < 3; i--) if (buf[i] === b.color) { buf.splice(i, 1); b.n++; }
        if (b.n === 3) boxes.splice(boxes.indexOf(b), 1);
      }
    };
    const need = c => { const i = q.indexOf(c); return i < 0 ? Infinity : i; };
    spawn();
    for (const rem of tiers) {
      if (!rem) continue;
      while (rem.length) {
        let i = rem.findIndex(k => boxes.some(b => b.color === list[k].color));
        if (i >= 0) {
          const k = rem.splice(i, 1)[0], b = boxes.find(x => x.color === list[k].color);
          order.push(k);
          if (++b.n === 3) { boxes.splice(boxes.indexOf(b), 1); spawn(); }
          continue;
        }
        if (buf.length >= BUF) return null;
        i = 0;
        for (let j = 1; j < rem.length; j++) if (need(list[rem[j]].color) < need(list[rem[i]].color)) i = j;
        const k = rem.splice(i, 1)[0];
        order.push(k);
        buf.push(list[k].color);
      }
    }
    return !boxes.length && !q.length && !buf.length ? order : null;
  }
  const solvable = (list, queue) => solveOrder(list, queue) !== null;

  // ---- 解けるかの判定(見えていて外せるねじ全部が手の候補) ----
  // 板の動きは安全側に見積もる。この見積もりで外せる手順は、実際のゲームでも必ず外せる
  //  ・ねじ2本以上の板は動かないので、置いた位置の形で隠す(判定の輪はゲームより 2 大きい)
  //  ・1本留めの板は揺れ方や衝突で向きが変わるので、残ったねじを中心に板が届く円の中はすべて隠すとみなす
  //  ・ねじ0本の板は何にも当たらずに落ちるので、落ちきれば何も隠さない(落ちきるのを待つ前提)
  const TRY_ASSIGN = 30;      // 色の割り当てを試す回数
  const SOLVE_BUDGET = 6000;  // 手順探索の打ち切り(調べる局面の数)
  const RING_SAFE = [[0, 0]];
  for (let k = 0; k < 16; k++) RING_SAFE.push([Math.cos(k * TAU / 16) * (SR + 3), Math.sin(k * TAU / 16) * (SR + 3)]);

  // cov[i] = ねじ i を隠しうる上の階層の板: { q, stat: 動かないときに隠すか, disc: 1本留めで隠す支点(穴番号のビット) }
  function buildModel(plates, list) {
    const cov = list.map(() => []);
    plates.forEach((pl, q) => {
      const reach = pl.holesW.map(([hx, hy]) => {
        let m = 0;
        for (const [x, y] of pl.wp) m = Math.max(m, len(x - hx, y - hy));
        return m + 12;                            // 粗い格子の目の分と縁取りと、支点のわずかな伸びの分
      });
      list.forEach((s, i) => {
        if (s.tier <= pl.tier) return;
        const l = unplace(pl, s.x, s.y);
        const stat = RING_SAFE.some(([ox, oy]) => pl.sh.f(l[0] + ox, l[1] + oy) < 0);
        let disc = 0;
        pl.holesW.forEach(([hx, hy], hi) => { if (len(s.x - hx, s.y - hy) < reach[hi] + SR + 3) disc |= 1 << hi; });
        if (stat || disc) cov[i].push({ q, stat, disc });
      });
    });
    return cov;
  }

  // 盤面の数え上げ用の模擬(物理なし)。apply で1本外し、save/restore で戻す
  function makeSim(plates, list, queue, cov) {
    const N = list.length;
    const T = list.reduce((m, s) => Math.max(m, s.tier), 0) + 1;
    const st = {
      left: plates.map(pl => (1 << pl.sh.holes.length) - 1),   // 板ごとに残っている穴(ビット)
      removed: new Uint8Array(N), tierLeft: new Int32Array(T),
      boxes: [], qi: 0, buf: new Array(COLORS.length).fill(0), bufN: 0, done: 0,
    };
    list.forEach(s => { st.tierLeft[s.tier]++; });
    const bits = m => (m & 1) + (m >> 1 & 1) + (m >> 2 & 1) + (m >> 3 & 1) + (m >> 4 & 1);
    const topTier = () => { for (let t = 0; t < T; t++) if (st.tierLeft[t]) return t; return T; };
    const blocked = i => {
      for (const c of cov[i]) {
        const m = st.left[c.q], n = bits(m);
        if (n >= 2 ? c.stat : n === 1 && (c.disc & m)) return true;
      }
      return false;
    };
    const avail = () => {
      const t0 = topTier(), out = [];
      for (let i = 0; i < N; i++) if (!st.removed[i] && list[i].tier - t0 < COLOR_DEPTH && !blocked(i)) out.push(i);
      return out;
    };
    const spawn = () => {
      while (st.boxes.length < ACTIVE && st.qi < queue.length) {
        const b = { c: queue[st.qi++], n: 0 };
        const take = Math.min(3, st.buf[b.c]);
        st.buf[b.c] -= take; st.bufN -= take; b.n = take;
        if (b.n < 3) st.boxes.push(b);
      }
    };
    const openFor = c => st.boxes.find(b => b.c === c);
    const apply = i => {                          // false = 合う箱が無く待機スロットも満杯
      const c = list[i].color, b = openFor(c);
      if (!b && st.bufN >= BUF) return false;
      st.removed[i] = 1; st.left[list[i].pl] &= ~(1 << list[i].hi); st.tierLeft[list[i].tier]--; st.done++;
      if (b) { if (++b.n === 3) { st.boxes.splice(st.boxes.indexOf(b), 1); spawn(); } }
      else { st.buf[c]++; st.bufN++; }
      return true;
    };
    const save = () => ({ boxes: st.boxes.map(b => ({ c: b.c, n: b.n })), qi: st.qi, buf: st.buf.slice(), bufN: st.bufN });
    const restore = (i, sv) => {
      st.removed[i] = 0; st.left[list[i].pl] |= 1 << list[i].hi; st.tierLeft[list[i].tier]++; st.done--;
      st.boxes = sv.boxes; st.qi = sv.qi; st.buf = sv.buf; st.bufN = sv.bufN;
    };
    const won = () => st.done === N && !st.boxes.length && st.qi === queue.length && !st.bufN;
    spawn();
    return { st, avail, apply, save, restore, won, openFor, topTier };
  }

  // 手なり: 合う箱があるねじを入れ、無ければ見えている中で一番多い色を待機スロットへ(箱の順番は知らない)
  function greedyPlay(plates, list, queue, cov) {
    const S = makeSim(plates, list, queue, cov), st = S.st;
    while (!S.won()) {
      const A = S.avail();
      if (!A.length) return false;
      let i = A.find(k => S.openFor(list[k].color));
      if (i === undefined) {
        if (st.bufN >= BUF) return false;
        const cnt = new Array(COLORS.length).fill(0), t0 = S.topTier();
        list.forEach((s, k) => { if (!st.removed[k] && s.tier - t0 < COLOR_DEPTH) cnt[s.color]++; });
        for (let c = 0; c < cnt.length; c++) cnt[c] += 2 * st.buf[c];
        i = A.reduce((a, k) => cnt[list[k].color] > cnt[list[a].color] ? k : a, A[0]);
      }
      S.apply(i);
    }
    return true;
  }

  // 手順の探索(深さ優先、行き止まりの局面は覚えておく)。返り値: 外す順番 / false(解けない) / null(打ち切り)
  function solveFull(plates, list, queue, cov, budget) {
    const S = makeSim(plates, list, queue, cov), st = S.st, path = [], dead = new Set();
    let nodes = 0;
    const need = c => { for (let k = st.qi; k < queue.length; k++) if (queue[k] === c) return k - st.qi; return 99; };
    const key = () => st.left.join(',') + '|' + st.qi + ':' + st.boxes.map(b => b.c + '.' + b.n).join(',') + '|' + st.buf.join('');
    function dfs() {
      if (S.won()) return true;
      if (++nodes > budget) return null;
      const k = key();
      if (dead.has(k)) return false;
      const A = S.avail();
      const moves = A.filter(i => S.openFor(list[i].color)).sort((a, b) => list[b].tier - list[a].tier);
      if (st.bufN < BUF) {                       // 待機スロットへ置く手は、早く要る色から3色、各2本まで
        const byColor = new Map();
        for (const i of A) {
          const c = list[i].color;
          if (S.openFor(c)) continue;
          if (!byColor.has(c)) byColor.set(c, []);
          if (byColor.get(c).length < 2) byColor.get(c).push(i);
        }
        [...byColor.entries()].sort((a, b) => need(a[0]) - need(b[0])).slice(0, 3).forEach(e => moves.push(...e[1]));
      }
      for (const i of moves) {
        const sv = S.save();
        if (!S.apply(i)) continue;
        const r = dfs();
        if (r) { path.push(i); return true; }
        S.restore(i, sv);
        if (r === null) return null;
      }
      dead.add(k);
      return false;
    }
    const r = dfs();
    return r ? path.reverse() : r;
  }

  // ---- 板の輪郭と質量 ----
  // 距離関数を格子で標本化し、マーチングスクエアで輪郭線を取り出す
  function contours(v, nx, ny, x0, y0, hs) {
    const pts = new Map(), adj = new Map();
    const at = (key, xa, ya, va, xb, yb, vb) => {
      if (!pts.has(key)) {
        const t = va / (va - vb);
        pts.set(key, [xa + (xb - xa) * t, ya + (yb - ya) * t]);
      }
      return key;
    };
    const link = (a, b) => {
      if (!adj.has(a)) adj.set(a, []);
      if (!adj.has(b)) adj.set(b, []);
      adj.get(a).push(b);
      adj.get(b).push(a);
    };
    for (let j = 0; j < ny - 1; j++) for (let i = 0; i < nx - 1; i++) {
      const a = v[j * nx + i], b = v[j * nx + i + 1], c = v[(j + 1) * nx + i + 1], d = v[(j + 1) * nx + i];
      const idx = (a < 0 ? 8 : 0) | (b < 0 ? 4 : 0) | (c < 0 ? 2 : 0) | (d < 0 ? 1 : 0);
      if (idx === 0 || idx === 15) continue;
      const X = x0 + i * hs, Y = y0 + j * hs;
      const T = () => at((j * nx + i) * 2, X, Y, a, X + hs, Y, b);
      const R = () => at((j * nx + i + 1) * 2 + 1, X + hs, Y, b, X + hs, Y + hs, c);
      const B = () => at(((j + 1) * nx + i) * 2, X, Y + hs, d, X + hs, Y + hs, c);
      const Lf = () => at((j * nx + i) * 2 + 1, X, Y, a, X, Y + hs, d);
      const mid = (a + b + c + d) / 4 < 0;
      switch (idx) {
        case 1: case 14: link(Lf(), B()); break;
        case 2: case 13: link(B(), R()); break;
        case 3: case 12: link(Lf(), R()); break;
        case 4: case 11: link(T(), R()); break;
        case 6: case 9: link(T(), B()); break;
        case 7: case 8: link(Lf(), T()); break;
        case 5: if (mid) { link(Lf(), T()); link(B(), R()); } else { link(T(), R()); link(Lf(), B()); } break;
        case 10: if (mid) { link(T(), R()); link(Lf(), B()); } else { link(Lf(), T()); link(B(), R()); } break;
      }
    }
    const loops = [], seen = new Set();
    for (const start of adj.keys()) {
      if (seen.has(start)) continue;
      const loop = [];
      let prev = null, cur = start;
      while (cur !== undefined && !seen.has(cur)) {
        seen.add(cur);
        loop.push(pts.get(cur));
        const nb = adj.get(cur);
        const next = nb[0] !== prev ? nb[0] : nb[1];
        prev = cur;
        cur = next;
      }
      if (loop.length > 2) loops.push(loop);
    }
    return loops;
  }
  function simplify(loop, eps) {
    const out = [loop[0]];
    for (let i = 1; i < loop.length; i++) {
      const p = out[out.length - 1], q = loop[i], r = loop[(i + 1) % loop.length];
      const ex = r[0] - p[0], ey = r[1] - p[1];
      const d = Math.abs(ex * (q[1] - p[1]) - ey * (q[0] - p[0])) / (len(ex, ey) || 1);
      if (d > eps) out.push(q);
    }
    return out;
  }
  function buildPlate(pl) {
    const { sh } = pl;
    const step = 1.5, pad = 5;
    const x0 = sh.box[0] - pad, y0 = sh.box[1] - pad;
    const nx = Math.ceil((sh.box[2] - sh.box[0] + 2 * pad) / step) + 1;
    const ny = Math.ceil((sh.box[3] - sh.box[1] + 2 * pad) / step) + 1;
    const v = new Float32Array(nx * ny);
    let n = 0, sx = 0, sy = 0, sq = 0;
    for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) {
      const x = x0 + i * step, y = y0 + j * step, d = sh.f(x, y);
      v[j * nx + i] = d;
      if (d < 0 && !sh.holes.some(h => len(x - h[0], y - h[1]) < HR)) {
        n++; sx += x; sy += y; sq += x * x + y * y;
      }
    }
    const area = n * step * step, mx = sx / n, my = sy / n;
    const inertia = (sq / n - mx * mx - my * my) * area;   // 重心まわりの断面二次極モーメント(密度1)
    const path = new Path2D();
    let rad = 0, outline = null, outArea = 0;
    for (const loop of contours(v, nx, ny, x0, y0, step)) {
      let a = 0;                                   // 一番大きい輪が外周(ほかは飾り穴)
      for (let i = 0, j = loop.length - 1; i < loop.length; j = i++) a += loop[j][0] * loop[i][1] - loop[i][0] * loop[j][1];
      if (Math.abs(a) > outArea) { outArea = Math.abs(a); outline = loop; }
      simplify(loop, 0.12).forEach(([x, y], k) => {
        if (k) path.lineTo(x - mx, y - my); else path.moveTo(x - mx, y - my);
        rad = Math.max(rad, len(x - mx, y - my));
      });
      path.closePath();
    }
    const holes = sh.holes.map(h => ({ x: h[0] - mx, y: h[1] - my }));
    for (const h of holes) {
      path.moveTo(h.x + HR, h.y);
      path.arc(h.x, h.y, HR, 0, TAU);
      path.closePath();
    }
    const f = (x, y) => {
      let d = sh.f(x + mx, y + my);
      for (const h of holes) d = Math.max(d, HR - len(x - h.x, y - h.y));
      return d;
    };
    outline = simplify(outline, 1).map(([x, y]) => [x - mx, y - my]);   // 衝突判定用(重心基準)
    return { path, holes, f, rad, area, inertia, mx, my, outline };
  }

  // 衝突用の剛体: 外周を凸な部品に分けた複合剛体。同じ階層の板どうしだけ衝突する。
  // 重心は実形状(穴を抜いた格子)の値に置き直し、質量と慣性モーメントも実形状の値にする
  function makeBody(g, x, y, ang, tier) {
    const poly = g.outline.map(([px, py]) => [px + x, py + y]);
    const toV = c => c.map(([px, py]) => ({ x: px, y: py }));
    let sets = [];
    try {
      decomp.makeCCW(poly);
      decomp.removeCollinearPoints(poly, 0.02);
      sets = decomp.quickDecomp(poly).filter(c => c.length >= 3).map(toV).filter(vs => Vertices.area(vs) > 4);
    } catch (e) { sets = []; }
    if (!sets.length) sets = [Vertices.hull(toV(poly))];
    const parts = sets.map(vs => Body.create({ position: Vertices.centre(vs), vertices: vs }));
    const bit = 1 << (tier % 30);
    const body = Body.create({ parts, frictionAir: 0.012, friction: 0.2, collisionFilter: { group: 0, category: bit, mask: bit } });
    Body.setCentre(body, { x, y });
    Body.setMass(body, g.area * DENSITY);
    Body.setInertia(body, g.inertia * DENSITY * INERTIA_SCALE);
    Body.setAngle(body, ang);
    return body;
  }

  // ---- ステージ構築 ----
  // ---- 遊び方(ステージ / ランダム) ----
  // ステージはステージ番号から決まる固定の盤面。ランダムは難しさを選び、毎回ちがう番号(種)で作る。
  // ランダムで遊んでもステージの到達点は変えない
  const DIFFS = [
    { name: 'やさしい', lv: 3 },
    { name: 'ふつう', lv: 8 },
    { name: 'むずかしい', lv: 16 },
  ];
  let cur = { mode: 'stage', lv: 1 }, stageLv = 1;
  const stageSeed = lv => lv * 7919 + 13;
  function newSeed() {
    try { return 100000 + crypto.getRandomValues(new Uint32Array(1))[0] % 900000; }
    catch (e) { return 100000 + Math.floor(Math.random() * 900000); }
  }
  function loadLevel(lv) {
    stageLv = lv;
    try { localStorage.setItem('screw-level', String(lv)); } catch (e) {}
    cur = { mode: 'stage', lv };
    build(lv, stageSeed(lv));
  }
  function loadRandom(diff, seed = newSeed()) {
    try { localStorage.setItem('screw-rand-diff', String(diff)); } catch (e) {}
    cur = { mode: 'random', diff, seed };
    build(DIFFS[diff].lv, seed);
  }
  const restart = () => cur.mode === 'stage' ? loadLevel(cur.lv) : loadRandom(cur.diff, cur.seed);
  function setTitle() {
    const main = document.getElementById('tMain'), sub = document.getElementById('tSub');
    if (cur.mode === 'stage') { main.textContent = `ステージ ${cur.lv}`; sub.hidden = true; }
    else { main.textContent = 'ランダム'; sub.textContent = `${DIFFS[cur.diff].name} #${cur.seed}`; sub.hidden = false; }
  }

  function build(lv, seed) {
    level = lv;
    ended = false;
    flashBuf = 0;
    stuckT = 0;
    engine = Engine.create();
    engine.gravity.y = 1.1;
    const data = genLevel(lv, seed);

    planks = data.plates.map(pl => {
      const g = buildPlate(pl);
      const [wx, wy] = place(pl, g.mx, g.my);
      const body = makeBody(g, wx, wy, pl.ang, pl.tier);
      Body.setStatic(body, true);
      Composite.add(engine.world, body);
      return { body, tier: pl.tier, tint: pl.tint, path: g.path, holes: g.holes, f: g.f, rad: g.rad, screws: [], constraint: null, nudge: null, gone: false, vis: 1, cvis: 1 };
    });

    screws = data.screws.map(s => {
      const sc = {
        plank: planks[s.pl], hole: s.hi, color: s.color, state: 'board',
        rot: (data.rnd() - 0.5) * 0.5 - planks[s.pl].body.angle,   // 十字は置いた時点でほぼ正立
        shake: 0, from: null, dest: null, t: 0,
      };
      sc.plank.screws.push(sc);
      return sc;
    });

    queue = data.queue.slice();
    boxes = new Array(ACTIVE).fill(null);
    buffer = new Array(BUF).fill(null);
    for (let i = 0; i < ACTIVE; i++) spawnBox(i);
    updateTop();
    planks.forEach(p => { p.vis = visible(p) ? 1 : 0; p.cvis = known(p) ? 1 : 0; });
    setTitle();
    document.getElementById('modal').hidden = true;
    updateHud();
  }

  function updateHud() {
    const off = screws.filter(s => s.state !== 'board').length;
    document.getElementById('pct').textContent = Math.round(off / screws.length * 100) + '%';
  }

  // ---- 座標 ----
  function holeWorld(p, i) {
    const h = p.holes[i];
    const r = rot(h.x, h.y, p.body.angle);
    return { x: p.body.position.x + r.x, y: p.body.position.y + r.y };
  }
  const ease = t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
  function boxY(b) {
    return BOX_Y - (1 - ease(b.enter)) * 120 - ease(b.leave) * 120;
  }
  function destPos(d) {
    if (d.kind === 'box') return { x: boxX(d.box.idx) + SLOT[d.slot][0], y: boxY(d.box) + SLOT[d.slot][1] };
    return { x: bufX(d.idx), y: BUF_Y };
  }
  function screwPos(s) {
    if (s.state === 'board') return holeWorld(s.plank, s.hole);
    if (s.state === 'fly') {
      const to = destPos(s.dest), e = ease(s.t);
      return {
        x: s.from.x + (to.x - s.from.x) * e,
        y: s.from.y + (to.y - s.from.y) * e - Math.sin(Math.PI * s.t) * 40,
      };
    }
    return destPos(s.dest);
  }

  // ---- 階層の見え方 ----
  // 最上階層 = ねじが残っている板のうち一番上の階層。そこから COLOR_DEPTH 段目までは板とねじの色が見えて触れる。
  // SHAPE_DEPTH 段目までは板の形だけ見える。最上階層の板が全部外れる(ねじ0本で落ち始める)と、見える範囲が下へずれる
  let topTier = 0;
  function updateTop() {
    let t = Infinity;
    for (const p of planks) if (p.screws.length) t = Math.min(t, p.tier);
    topTier = t;
  }
  const visible = p => p.tier - topTier < SHAPE_DEPTH;   // 板の形が見える
  const known = p => p.tier - topTier < COLOR_DEPTH;     // ねじの色が見えて触れる

  // ---- 遮蔽判定: 上の階層の板がねじに少しでも被っていたら外せない ----
  function isBlocked(s) {
    const p = s.plank, c = holeWorld(p, s.hole);
    for (const q of planks) {
      if (q.gone || q.tier >= p.tier) continue;
      const dx = c.x - q.body.position.x, dy = c.y - q.body.position.y;
      if (dx * dx + dy * dy > (q.rad + SR + 3) ** 2) continue;
      const l = rot(dx, dy, -q.body.angle);
      if (covers(q.f, l.x, l.y)) return true;
    }
    return false;
  }

  // ---- 箱 ----
  function spawnBox(i) {
    if (!queue.length) { boxes[i] = null; return; }
    const b = { idx: i, color: queue.shift(), reserved: 0, arrived: 0, items: [], enter: 0, leaving: false, leave: 0 };
    boxes[i] = b;
    pullFromBuffer(b);
  }
  function openBoxFor(color) {
    return boxes.find(b => b && !b.leaving && b.color === color && b.reserved < 3);
  }
  function pullFromBuffer(b) {
    for (let k = 0; k < BUF; k++) {
      const s = buffer[k];
      if (s && s.state === 'buffer' && s.color === b.color && b.reserved < 3 && !b.leaving) {
        buffer[k] = null;
        launch(s, { kind: 'box', box: b, slot: b.reserved++ });
        b.items.push(s);
      }
    }
  }

  function launch(s, dest) {
    s.from = screwPos(s);
    s.dest = dest;
    s.state = 'fly';
    s.t = 0;
  }

  function arrive(s) {
    if (s.dest.kind === 'box') {
      s.state = 'box';
      const b = s.dest.box;
      b.arrived++;
      if (b.arrived === 3) { b.leaving = true; b.leave = 0; chime(); }
    } else {
      s.state = 'buffer';
      boxes.forEach(b => { if (b && !b.leaving) pullFromBuffer(b); });
    }
  }

  // ---- 板からねじを抜く ----
  function detach(s) {
    const p = s.plank;
    p.screws = p.screws.filter(x => x !== s);
    p.nudge = null;
    if (p.constraint) { Composite.remove(engine.world, p.constraint); p.constraint = null; }
    if (p.screws.length === 1) {
      const r = p.screws[0];
      const w = holeWorld(p, r.hole);
      Body.setStatic(p.body, false);
      p.constraint = Constraint.create({
        pointA: { x: w.x, y: w.y },
        bodyB: p.body,
        pointB: { x: w.x - p.body.position.x, y: w.y - p.body.position.y },
        length: 0, stiffness: 0.9, damping: 0.05,
      });
      Composite.add(engine.world, p.constraint);
      // 重心が残ったねじのほぼ真上にある(倒立の釣り合い)と、物理的には倒れるはずでも静止したままになる。
      // 左右どちらかへゆっくり押し出して、ひっくり返らせる。重心が少しでもずれていればその向きへ
      const dx = p.body.position.x - w.x, dy = p.body.position.y - w.y, d = len(dx, dy);
      if (d > 5 && dy < 0 && Math.abs(dx) < 0.25 * d) {
        const dir = Math.abs(dx) > 1 ? Math.sign(dx) : (Math.random() < 0.5 ? -1 : 1);
        p.nudge = { dir, a0: p.body.angle, t: 0 };
      }
    } else if (p.screws.length === 0) {
      Body.setStatic(p.body, false);
      p.body.collisionFilter.mask = 0;   // ねじ0本の板は何にも当たらずに落ちる(止まる位置が読めないと、解ける保証が立たない)
    }
  }

  // 物理1ステップごとに、押し出し中の板の回転速度を下支えする
  function nudgeStep() {
    for (const p of planks) {
      const n = p.nudge;
      if (!n) continue;
      n.t += STEP;
      if (Math.abs(p.body.angle - n.a0) > NUDGE_ANGLE || n.t > 4000) { p.nudge = null; continue; }
      if (n.dir * p.body.angularVelocity < NUDGE_W) Body.setAngularVelocity(p.body, n.dir * NUDGE_W);
    }
  }

  function tapScrew(s) {
    if (!known(s.plank) || isBlocked(s)) { s.shake = 0.3; buzz(); return; }
    const b = openBoxFor(s.color);
    let dest;
    if (b) {
      dest = { kind: 'box', box: b, slot: b.reserved++ };
      b.items.push(s);
    } else {
      const k = buffer.indexOf(null);
      if (k < 0) { flashBuf = 0.45; buzz(); return; }
      buffer[k] = s;
      dest = { kind: 'buf', idx: k };
    }
    const from = holeWorld(s.plank, s.hole);
    detach(s);
    s.state = 'board';
    launch(s, dest);
    s.from = from;
    updateHud();
    click();
    try { navigator.vibrate && navigator.vibrate(12); } catch (e) {}
  }

  // ---- 入力 ----
  cv.addEventListener('pointerdown', e => {
    if (ended) return;
    const r = cv.getBoundingClientRect();
    const x = (e.clientX - r.left) / scale, y = (e.clientY - r.top) / scale;
    let best = null;
    for (const s of screws) {
      if (s.state !== 'board' || !visible(s.plank)) continue;
      const p = holeWorld(s.plank, s.hole);
      if (Math.hypot(p.x - x, p.y - y) < 22 && (!best || s.plank.tier < best.plank.tier)) best = s;
    }
    if (best) tapScrew(best);
  });
  const $ = id => document.getElementById(id);
  $('retry').addEventListener('click', restart);
  $('mBtn').addEventListener('click', () => {
    const won = $('mBtn').dataset.won === '1';
    if (!won) restart();
    else if (cur.mode === 'stage') loadLevel(cur.lv + 1);
    else loadRandom(cur.diff);
  });
  $('mBack').addEventListener('click', () => loadLevel(stageLv));
  // サイコロ: 難しさを選んでランダムな盤面へ
  const pickBtns = [...document.querySelectorAll('.pickbtn')];
  pickBtns.forEach(b => {
    const d = DIFFS[+b.dataset.diff];
    b.querySelector('small').textContent = `${colorsFor(d.lv)}色・${tierGoal(d.lv)}段` + (d.lv >= 5 ? '・先読みが要る' : '');
    b.addEventListener('click', () => { $('pick').hidden = true; loadRandom(+b.dataset.diff); });
  });
  $('dice').addEventListener('click', () => {
    let last = 1;
    try { last = parseInt(localStorage.getItem('screw-rand-diff'), 10); } catch (e) {}
    if (!(last >= 0 && last < DIFFS.length)) last = 1;
    pickBtns.forEach(b => b.classList.toggle('on', +b.dataset.diff === last));
    $('pickBack').hidden = cur.mode === 'stage';
    $('pickBack').textContent = `ステージ ${stageLv} に戻る`;
    $('pick').hidden = false;
  });
  $('pickBack').addEventListener('click', () => { $('pick').hidden = true; loadLevel(stageLv); });
  $('pickClose').addEventListener('click', () => { $('pick').hidden = true; });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') $('pick').hidden = true; });

  // ---- 音 ----
  let actx = null;
  function tone(f, d, type, vol, slide) {
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      const t0 = actx.currentTime;
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type;
      o.frequency.setValueAtTime(f, t0);
      o.frequency.exponentialRampToValueAtTime(f * slide, t0 + d);
      g.gain.setValueAtTime(vol, t0);
      g.gain.exponentialRampToValueAtTime(0.001, t0 + d);
      o.connect(g).connect(actx.destination);
      o.start(t0); o.stop(t0 + d);
    } catch (e) {}
  }
  const click = () => tone(620, 0.07, 'triangle', 0.18, 1.8);
  const buzz = () => tone(140, 0.12, 'square', 0.06, 0.8);
  const chime = () => { tone(880, 0.12, 'sine', 0.14, 1.0); setTimeout(() => tone(1320, 0.16, 'sine', 0.12, 1.0), 90); };

  // ---- 進行 ----
  function idle() {
    return !screws.some(s => s.state === 'fly') && boxes.every(b => !b || (!b.leaving && b.enter >= 1));
  }
  // 盤面が落ち着いているか: 落ちていく板は盤面の下へ抜け、ぶら下がった板の揺れもほぼ止まっている。
  // 落ちる途中や揺れている途中の板は一瞬だけねじを隠すことがあるので、詰みの判定は落ち着いてから行う
  function settled() {
    return planks.every(p => p.gone || p.body.isStatic ||
      (p.screws.length ? Math.abs(p.body.angularVelocity) < 0.003 : p.body.position.y - p.rad > BOARD.y1));
  }
  function canMove() {
    if (buffer.includes(null)) return true;
    return screws.some(s => s.state === 'board' && known(s.plank) && !isBlocked(s) && openBoxFor(s.color));
  }
  function finish(won) {
    ended = true;
    setTimeout(() => {
      const rand = cur.mode === 'random';
      document.getElementById('mTitle').textContent = won ? 'クリア' : '詰み';
      document.getElementById('mSub').textContent = won
        ? (rand ? `ランダム（${DIFFS[cur.diff].name}）#${cur.seed} の板を全部落とした` : `ステージ ${cur.lv} の板を全部落とした`)
        : '待機スロットが埋まって、入れられるねじが無い';
      document.getElementById('mBack').hidden = !rand;
      const btn = document.getElementById('mBtn');
      btn.textContent = won ? (rand ? '次のランダムへ' : '次のステージへ') : 'もう一回';
      btn.dataset.won = won ? '1' : '0';
      document.getElementById('modal').hidden = false;
    }, won ? 700 : 350);
  }

  function update(dt) {
    if (flashBuf > 0) flashBuf = Math.max(0, flashBuf - dt);
    updateTop();
    for (const p of planks) {             // 新しく見えた板やねじの色はふわっと出す
      const k = Math.min(1, dt * 5);
      p.vis += ((visible(p) ? 1 : 0) - p.vis) * k;
      p.cvis += ((known(p) ? 1 : 0) - p.cvis) * k;
    }
    for (const s of screws) {
      if (s.shake > 0) s.shake = Math.max(0, s.shake - dt);
      if (s.state === 'fly') {
        s.t += dt / FLY;
        if (s.t >= 1) { s.t = 1; arrive(s); }
      }
    }
    for (let i = 0; i < ACTIVE; i++) {
      const b = boxes[i];
      if (!b) continue;
      if (b.enter < 1) b.enter = Math.min(1, b.enter + dt / 0.3);
      if (b.leaving) {
        b.leave += dt / 0.35;
        if (b.leave >= 1) {
          b.items.forEach(s => { s.state = 'done'; });
          spawnBox(i);
        }
      }
    }
    for (const p of planks) {
      if (!p.gone && p.body.position.y > H + 320) {
        p.gone = true;
        Composite.remove(engine.world, p.body);
      }
    }
    // 詰みは「落ち着いていて外せる手が無い」状態が STUCK_HOLD 秒続いたときだけ。
    // ぶら下がった板は揺れの折り返しで一瞬止まるので、その瞬間だけで決めない
    let stuckNow = false;
    if (!ended && idle()) {
      const onBoard = screws.some(s => s.state === 'board');
      if (!onBoard && !queue.length && boxes.every(b => !b)) finish(true);
      else stuckNow = onBoard && settled() && !canMove();
    }
    stuckT = stuckNow ? stuckT + dt : 0;
    if (stuckT >= STUCK_HOLD) finish(false);
  }

  // ---- 描画 ----
  function rr(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  function makeGradients() {
    COLORS.forEach(C => {
      const g = ctx.createRadialGradient(-4, -5, 1, -1, -1, SR);
      g.addColorStop(0, C.l);
      g.addColorStop(0.6, C.c);
      g.addColorStop(1, C.c);
      C.g = g;
    });
  }
  function crossPath(k) {
    ctx.beginPath();
    ctx.moveTo(-k, 0); ctx.lineTo(k, 0);
    ctx.moveTo(0, -k); ctx.lineTo(0, k);
  }
  function drawScrew(x, y, ci, a, sc) {
    const C = COLORS[ci];
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(sc, sc);
    ctx.beginPath(); ctx.arc(0.6, 2.4, SR + 0.5, 0, TAU); ctx.fillStyle = 'rgba(38,14,0,0.38)'; ctx.fill();
    ctx.beginPath(); ctx.arc(0, 0, SR, 0, TAU); ctx.fillStyle = C.d; ctx.fill();
    ctx.beginPath(); ctx.arc(0, 0, SR - 2, 0, TAU); ctx.fillStyle = C.g; ctx.fill();
    ctx.lineCap = 'round';
    ctx.save(); ctx.rotate(a); crossPath(6.2); ctx.strokeStyle = C.d; ctx.lineWidth = 4.8; ctx.stroke(); ctx.restore();
    ctx.save(); ctx.translate(0.5, 0.9); ctx.rotate(a); crossPath(5.2); ctx.strokeStyle = C.m; ctx.lineWidth = 2; ctx.stroke(); ctx.restore();
    ctx.restore();
  }
  // 色の分からないねじ(形だけ見える階層)。銀色のねじと見分けがつくよう、色の無い暗い影で描く
  function drawBlank(x, y, a) {
    ctx.save();
    ctx.translate(x, y);
    ctx.beginPath(); ctx.arc(0, 0, SR, 0, TAU); ctx.fillStyle = '#3a2618'; ctx.fill();
    ctx.beginPath(); ctx.arc(0, 0, SR - 2, 0, TAU); ctx.fillStyle = '#5a4030'; ctx.fill();
    ctx.rotate(a); crossPath(6.2);
    ctx.lineCap = 'round'; ctx.strokeStyle = '#3a2618'; ctx.lineWidth = 4.8; ctx.stroke();
    ctx.restore();
  }
  function drawBox(x, y, ci) {
    const C = COLORS[ci];
    ctx.lineWidth = 7; ctx.strokeStyle = C.d;
    rr(x - 25, y - 45, 50, 26, 11); ctx.stroke();                       // 取っ手
    rr(x - 50, y - 29, 100, 78, 17); ctx.fillStyle = C.d; ctx.fill();     // 底の厚み
    rr(x - 50, y - 34, 100, 78, 17); ctx.fillStyle = C.c; ctx.fill();
    rr(x - 46, y - 31, 92, 18, 9); ctx.fillStyle = 'rgba(255,255,255,0.25)'; ctx.fill();
    rr(x - 41, y - 25, 82, 57, 12); ctx.fillStyle = '#f4f2f7'; ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(0,0,0,0.12)'; ctx.stroke();
    for (const [ox, oy] of SLOT) {
      ctx.beginPath(); ctx.arc(x + ox, y + oy, 12, 0, TAU); ctx.fillStyle = '#aaa8b4'; ctx.fill();
      ctx.beginPath(); ctx.arc(x + ox, y + oy + 1.5, 10.5, 0, TAU); ctx.fillStyle = '#c6c4ce'; ctx.fill();
    }
  }
  function drawPlate(p) {
    const { x, y } = p.body.position, a = p.body.angle, A = ctx.globalAlpha;
    ctx.save();                                   // 影(常に真下へずらす)
    ctx.translate(x, y + 3); ctx.rotate(a);
    ctx.fillStyle = 'rgba(45,18,2,0.2)'; ctx.fill(p.path, 'evenodd');
    ctx.restore();
    ctx.save();
    ctx.translate(x, y); ctx.rotate(a);
    ctx.globalAlpha = A * 0.82; ctx.fillStyle = p.tint; ctx.fill(p.path, 'evenodd');
    ctx.globalAlpha = A;
    ctx.save();                                   // 縁の内側を少し明るく
    ctx.clip(p.path, 'evenodd');
    ctx.lineWidth = 10; ctx.strokeStyle = 'rgba(255,255,255,0.1)'; ctx.stroke(p.path);
    ctx.restore();
    ctx.lineWidth = LINE; ctx.lineJoin = 'round'; ctx.strokeStyle = '#fff8ea'; ctx.stroke(p.path);
    ctx.restore();
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);

    // 箱
    for (let i = 0; i < ACTIVE; i++) {
      const b = boxes[i], x = boxX(i);
      if (!b) {
        rr(x - 50, BOX_Y - 34, 100, 78, 17);
        ctx.fillStyle = 'rgba(40,16,2,0.18)'; ctx.fill();
        ctx.setLineDash([7, 6]); ctx.lineWidth = 2.5; ctx.strokeStyle = 'rgba(255,236,210,0.28)'; ctx.stroke();
        ctx.setLineDash([]);
        continue;
      }
      const y = boxY(b);
      ctx.save();
      ctx.globalAlpha = 1 - ease(b.leave);
      drawBox(x, y, b.color);
      for (const s of b.items) if (s.state === 'box') drawScrew(x + SLOT[s.dest.slot][0], y + SLOT[s.dest.slot][1], s.color, s.rot, 0.96);
      ctx.restore();
    }

    // 待機スロット
    const filled = buffer.filter(Boolean).length;
    rr(bufX(0) - 24, BUF_Y - 20, bufX(BUF - 1) - bufX(0) + 48, 40, 20);
    ctx.fillStyle = 'rgba(40,16,2,0.28)'; ctx.fill();
    ctx.lineWidth = 2.5;
    ctx.strokeStyle = flashBuf > 0 && Math.floor(flashBuf * 14) % 2 === 0 ? '#ff4040'
      : filled >= BUF - 1 ? '#ff9a3c' : 'rgba(255,236,210,0.22)';
    ctx.stroke();
    for (let k = 0; k < BUF; k++) {
      const x = bufX(k);
      ctx.beginPath(); ctx.arc(x, BUF_Y, 12.5, 0, TAU); ctx.fillStyle = '#3a1b08'; ctx.fill();
      ctx.beginPath(); ctx.arc(x, BUF_Y - 1.5, 11, 0, TAU); ctx.fillStyle = '#1e0d03'; ctx.fill();
    }
    for (const s of buffer) if (s && s.state === 'buffer') drawScrew(bufX(s.dest.idx), BUF_Y, s.color, s.rot, 1);

    // 板(下の層から)とねじ
    for (const p of planks) {
      if (p.gone || p.vis < 0.01) continue;
      ctx.save();
      ctx.globalAlpha = p.vis;
      drawPlate(p);
      for (const s of p.screws) {
        const w = holeWorld(p, s.hole);
        const sx = s.shake > 0 ? Math.sin(s.shake * 70) * 3.5 * (s.shake / 0.3) : 0;
        if (p.cvis < 0.99) drawBlank(w.x + sx, w.y, s.rot + p.body.angle);
        if (p.cvis > 0.01) {
          ctx.globalAlpha = p.vis * p.cvis;
          drawScrew(w.x + sx, w.y, s.color, s.rot + p.body.angle, 1);
          ctx.globalAlpha = p.vis;
        }
      }
      ctx.restore();
    }

    // 飛んでいるねじ
    for (const s of screws) {
      if (s.state !== 'fly') continue;
      const p = screwPos(s);
      drawScrew(p.x, p.y, s.color, s.rot + s.t * 9, 1 + 0.28 * Math.sin(Math.PI * s.t));
    }
  }

  // ---- 背景の木目 ----
  function paintWood() {
    const w = 480, h = 860;
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    const g = c.getContext('2d');
    const img = g.createImageData(w, h), D = img.data;
    const rnd = mulberry32(20260927);
    const lat = Array.from({ length: 512 }, () => rnd());
    const noise = t => {
      const i = Math.floor(t), f = t - i, u = f * f * (3 - 2 * f);
      return lat[i & 511] * (1 - u) + lat[(i + 1) & 511] * u;
    };
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const u = x + 16 * Math.sin(y * 0.0105 + x * 0.006) + 7 * Math.sin(y * 0.031 + x * 0.02);
      const tone = 0.6 * noise(u * 0.03) + 0.4 * noise(u * 0.11 + 40);
      const ring = (u * 0.055 + 3 * noise(u * 0.012 + y * 0.0015 + 90)) % 1;
      const line = Math.max(0, 1 - Math.abs(ring - 0.5) * 9);
      const fine = 0.5 * noise(u * 0.9 + 200) + 0.5 * noise(u * 2.3 + y * 0.01 + 300);
      const dx = x / w - 0.5, dy = y / h - 0.45;
      const vig = 1 - 0.9 * (dx * dx * 1.3 + dy * dy * 0.7);
      const k = (0.74 + 0.26 * tone + 0.07 * fine - 0.16 * line) * vig;
      const i4 = (y * w + x) * 4;
      D[i4] = 176 * k; D[i4 + 1] = 98 * k; D[i4 + 2] = 42 * k; D[i4 + 3] = 255;
    }
    g.putImageData(img, 0, 0);
    try { document.body.style.backgroundImage = `url(${c.toDataURL('image/jpeg', 0.88)})`; } catch (e) {}
  }

  // ---- 画面合わせ ----
  function fit() {
    const aw = stage.clientWidth, ah = stage.clientHeight;
    scale = Math.min(aw / W, ah / H);
    dpr = window.devicePixelRatio || 1;
    cv.style.width = W * scale + 'px';
    cv.style.height = H * scale + 'px';
    cv.width = Math.round(W * scale * dpr);
    cv.height = Math.round(H * scale * dpr);
    ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
  }
  window.addEventListener('resize', fit);

  // ---- ループ ----
  const STEP = 1000 / 60;
  let last = performance.now(), acc = 0;
  function frame(now) {
    let dt = now - last; last = now;
    if (dt > 100) dt = 100;
    acc += dt;
    while (acc >= STEP) { nudgeStep(); Engine.update(engine, STEP); acc -= STEP; }
    update(dt / 1000);
    draw();
    requestAnimationFrame(frame);
  }

  let startLv = 1;
  try { startLv = parseInt(localStorage.getItem('screw-level'), 10) || 1; } catch (e) {}
  paintWood();
  makeGradients();
  fit();
  loadLevel(startLv);
  requestAnimationFrame(frame);
})();
</script>
