  }
  function updateFx(dt) {
    for (const p of poppers) {
      p.t += dt;
      if (!p.popped && p.t >= p.at) { p.popped = true; p.onPop(); }
    }
    poppers = poppers.filter(p => p.t < p.at + 1.2);
    if (flash > 0) flash = Math.max(0, flash - dt * 1.6);
    if (flashHue >= 0) flashHue += 520 * dt;
    for (const q of parts) {
      q.t += dt;
      if (q.kind === 'star') { q.x += q.vx * dt; q.y += q.vy * dt; q.vx *= 1 - 3 * dt; q.vy *= 1 - 3 * dt; q.rot += q.vr * dt; continue; }
      if (q.kind === 'coin') {                   // 弧を描いて上のコインへ。届いたら音とコインの光
        const u = Math.min(1, q.t / q.life), e = u * u * (3 - 2 * u);
        q.x = q.x0 + (q.x1 - q.x0) * e; q.y = q.y0 + (q.y1 - q.y0) * e - Math.sin(Math.PI * u) * q.lift;
        if (u >= 1 && !q.hit) { q.hit = true; coinTick(); glowCoin(); }

        continue;

      q.vy += 900 * q.g * dt;
      q.vx *= 1 - 1.6 * dt; q.vy *= 1 - (q.vy > 0 ? 3.2 : 0.8) * dt;   // 落ちるときは空気で遅くなる(ひらひら)
      q.vx += Math.sin(q.t * 5 + q.ph) * 90 * dt;
      q.x += q.vx * dt; q.y += q.vy * dt; q.rot += q.vr * dt;

  function drawPopper(p) {

    for (let yy = -30; yy < 30; yy += 14) { fxx.beginPath(); fxx.moveTo(-20, yy); fxx.lineTo(20, yy - 8); fxx.lineTo(20, yy - 2); fxx.lineTo(-20, yy + 6); fxx.fill(); }

    fxx.lineWidth = 2.5; fxx.strokeStyle = '#7a3a06'; fxx.stroke();
    fxx.beginPath(); fxx.ellipse(0, -30, 18, 5, 0, 0, TAU); fxx.fillStyle = '#fff4d0'; fxx.fill(); fxx.stroke();
    fxx.restore();
  }
  function drawFx() {
    if (!parts.length && !poppers.length && flash <= 0) {

      return;
    }
    fxDirty = true;
    fxx.clearRect(0, 0, fxW, fxH);
    if (flash > 0) {                             // 光(派手めは虹色に移ろう)
      fxx.fillStyle = flashHue >= 0 ? `hsla(${flashHue % 360},100%,82%,${flash})` : `rgba(255,250,230,${flash})`;
      fxx.fillRect(0, 0, fxW, fxH);
    }
    for (const p of poppers) drawPopper(p);
    for (const q of parts) {
      const a = q.kind === 'star' || q.kind === 'spark' || q.kind === 'bloom' ? 1 - q.t / q.life : Math.min(1, (q.life - q.t) / 0.6);
      fxx.save();
      fxx.globalAlpha = Math.max(0, a);
      if (q.kind === 'spark') {                   // 火花: 進む向きに尾を引く線
        fxx.strokeStyle = q.c; fxx.lineWidth = 2.6; fxx.lineCap = 'round';
        fxx.beginPath(); fxx.moveTo(q.x - q.vx * 0.06, q.y - q.vy * 0.06); fxx.lineTo(q.x, q.y); fxx.stroke();
        fxx.fillStyle = '#ffffff'; fxx.beginPath(); fxx.arc(q.x, q.y, 1.4, 0, TAU); fxx.fill();
        fxx.restore(); continue;
      }
      if (q.kind === 'bloom') {                   // 花火の芯の光
        const g = fxx.createRadialGradient(q.x, q.y, 0, q.x, q.y, 60);
        g.addColorStop(0, 'rgba(255,255,255,0.9)'); g.addColorStop(1, 'rgba(255,255,255,0)');
        fxx.fillStyle = g; fxx.beginPath(); fxx.arc(q.x, q.y, 60, 0, TAU); fxx.fill();
        fxx.restore(); continue;
      }
      if (q.kind === 'coin') {
        fxx.translate(q.x, q.y); fxx.scale(Math.abs(Math.cos(q.t * 9)) * 0.8 + 0.2, 1);
        fxx.beginPath(); fxx.arc(0, 0, 10, 0, TAU); fxx.fillStyle = '#e09a12'; fxx.fill();
        fxx.beginPath(); fxx.arc(0, -1, 8.5, 0, TAU); fxx.fillStyle = '#ffc93c'; fxx.fill();
        fxx.beginPath(); fxx.arc(-2.5, -3.5, 3, 0, TAU); fxx.fillStyle = '#fff3b0'; fxx.fill();
        fxx.restore(); continue;
      }
      if (q.kind === 'ribbon') {                  // リボン: 波打つ帯
        fxx.strokeStyle = q.c; fxx.lineWidth = 5; fxx.lineCap = 'round'; fxx.lineJoin = 'round';
        fxx.beginPath();
        for (let i = 0; i <= 10; i++) {
          const u = i / 10, xx = q.x + Math.sin(q.t * 6 + q.ph + u * 7) * 9, yy = q.y - u * q.len;
          if (i) fxx.lineTo(xx, yy); else fxx.moveTo(xx, yy);
        }
        fxx.stroke(); fxx.restore(); continue;
      }
      fxx.translate(q.x, q.y); fxx.rotate(q.rot);
      fxx.fillStyle = q.c;
      if (q.kind === 'paper') { fxx.scale(Math.cos(q.flip), 1); fxx.fillRect(-q.w / 2, -q.h / 2, q.w, q.h); }
      else if (q.kind === 'dot') { fxx.beginPath(); fxx.arc(0, 0, q.w / 2, 0, TAU); fxx.fill(); }
      else {                                        // 4つ角の星
        const r = q.size;
        fxx.beginPath();
        for (let i = 0; i < 8; i++) { const rr2 = i % 2 ? r * 0.35 : r, an = i * Math.PI / 4; fxx.lineTo(Math.cos(an) * rr2, Math.sin(an) * rr2); }
        fxx.closePath(); fxx.fill();
      }
      fxx.restore();
    }
  }

  // ---- 背景の木目 ----
  function paintWood() {
    const w = 480, h = 860;
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    const g = c.getContext('2d');
    const img = g.createImageData(w, h), D = img.data;
    const rnd = mulberry32(20260927);
    const lat = Array.from({ length: 512 }, () => rnd());
    const noise = t => {
      const i = Math.floor(t), f = t - i, u = f * f * (3 - 2 * f);
      return lat[i & 511] * (1 - u) + lat[(i + 1) & 511] * u;
    };
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const u = x + 16 * Math.sin(y * 0.0105 + x * 0.006) + 7 * Math.sin(y * 0.031 + x * 0.02);
      const tone = 0.6 * noise(u * 0.03) + 0.4 * noise(u * 0.11 + 40);
      const ring = (u * 0.055 + 3 * noise(u * 0.012 + y * 0.0015 + 90)) % 1;
      const line = Math.max(0, 1 - Math.abs(ring - 0.5) * 9);
      const fine = 0.5 * noise(u * 0.9 + 200) + 0.5 * noise(u * 2.3 + y * 0.01 + 300);
      const dx = x / w - 0.5, dy = y / h - 0.45;
      const vig = 1 - 0.9 * (dx * dx * 1.3 + dy * dy * 0.7);
      const k = (0.74 + 0.26 * tone + 0.07 * fine - 0.16 * line) * vig;
      const i4 = (y * w + x) * 4;
      D[i4] = 176 * k; D[i4 + 1] = 98 * k; D[i4 + 2] = 42 * k; D[i4 + 3] = 255;
    }
    g.putImageData(img, 0, 0);
    try { document.body.style.backgroundImage = `url(${c.toDataURL('image/jpeg', 0.88)})`; } catch (e) {}
  }

  // ---- 画面合わせ ----
  function fit() {
    const aw = stage.clientWidth, ah = stage.clientHeight;
    scale = Math.min(aw / W, ah / H);
    dpr = window.devicePixelRatio || 1;
    cv.style.width = W * scale + 'px';
    cv.style.height = H * scale + 'px';
    cv.width = Math.round(W * scale * dpr);
    cv.height = Math.round(H * scale * dpr);
    ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
    fitFx();
  }
  window.addEventListener('resize', fit);

  // ---- ループ ----
  const STEP = 1000 / 60;
  let last = performance.now(), acc = 0;
  function frame(now) {
    let dt = now - last; last = now;
    if (dt > 100) dt = 100;
    acc += dt;
    while (acc >= STEP) { nudgeStep(); calmStep(); Engine.update(engine, STEP); acc -= STEP; }
    update(dt / 1000);
    updateFx(dt / 1000);
    draw();
    drawFx();
    requestAnimationFrame(frame);
  }

  let startLv = 1;
  try { startLv = parseInt(localStorage.getItem('screw-level'), 10) || 1; } catch (e) {}
  paintWood();
  makeGradients();
  fit();
  loadLevel(startLv);
  requestAnimationFrame(frame);
})();
</script>
