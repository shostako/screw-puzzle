<title>ネジ外し工房</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/poly-decomp@0.3.0/build/decomp.min.js"></script>
<style>
  /* hidden 属性を付けたものは、display を指定した要素でも必ず隠す。
     Artifact は公開時の外枠がこれを持つが、Pages の外枠(build.sh)には無いので、ここで同じにそろえる */
  [hidden] { display: none !important; }
  /* 木の作業台の上で遊ぶ単一テーマ。背景の木目は起動時に描いて body に貼る */
  :root {
    color-scheme: dark;
    --wood: #8a4a1d;
    --wood-edge: #5a2f0f;
    --wood-shadow: #4a260c;
    --ink: #ffffff;
    --ink-edge: #4a2408;
    --gold: #ffc93c;
    --go: #4cc94a;
    --go-deep: #2b8a2a;
    --round: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
  }
  html, body { height: 100%; margin: 0; }
  body {
    background-color: var(--wood);
    background-size: cover;
    background-position: center;
    color: var(--ink);
    font-family: var(--round);
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #app {
    height: 100%;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    padding-inline: 16px;
    padding-block: 10px 8px;
    gap: 4px;
  }
  #hud {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    max-width: 420px;
    width: 100%;
    margin-inline: auto;
  }
  .outlined {
    text-shadow:
      2px 0 0 var(--ink-edge), -2px 0 0 var(--ink-edge), 0 2px 0 var(--ink-edge), 0 -2px 0 var(--ink-edge),
      1.5px 1.5px 0 var(--ink-edge), -1.5px 1.5px 0 var(--ink-edge), 1.5px -1.5px 0 var(--ink-edge), -1.5px -1.5px 0 var(--ink-edge),
      0 4px 0 rgba(40, 16, 2, 0.45);
  }
  #title {
    display: flex;
    flex-direction: column;
    align-items: center;
    line-height: 1.1;
    font-weight: 800;
    font-size: 24px;
    letter-spacing: 0.04em;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .tools { justify-self: start; display: flex; gap: 8px; }
  .woodbtn {
    width: 42px;
    height: 42px;
    padding: 0;
    border-radius: 50%;
    border: 3px solid var(--wood-edge);
    background: radial-gradient(circle at 40% 35%, #f0b46a, #c9803d 60%, #a9652a);
    box-shadow: 0 3px 0 var(--wood-shadow), inset 0 2px 0 rgba(255, 255, 255, 0.35);
    display: grid;
    place-items: center;
    cursor: pointer;
  }
  .woodbtn svg { width: 22px; height: 22px; }
  .woodbtn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--wood-shadow), inset 0 2px 0 rgba(255, 255, 255, 0.35); }
  .woodbtn:focus-visible, #mBtn:focus-visible, .pickbtn:focus-visible, .subbtn:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
  #prog {
    justify-self: end;
    display: flex;
    align-items: center;
    gap: 6px;
    font-weight: 800;
    font-size: 20px;
    font-variant-numeric: tabular-nums;
  }
  .coin {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff3b0, var(--gold) 45%, #e09a12);
    box-shadow: 0 2px 0 #8a5600, inset 0 0 0 2px rgba(150, 90, 0, 0.5);
  }
  #stage {
    position: relative;
    flex: 1;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas { display: block; touch-action: none; }
  #tSub { font-size: 12px; font-weight: 700; letter-spacing: 0.06em; }
  #modal, #pick, #settings {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    background: rgba(35, 14, 2, 0.55);
    z-index: 3;                           /* 知らせ(z-index 2)より前 */
  }
  #modal[hidden], #pick[hidden], #settings[hidden] { display: none; }
  #modal .card, #pick .card, #settings .card {
    background: linear-gradient(#e2a563, #c47f3e);
    border: 4px solid var(--wood-edge);
    border-radius: 22px;
    box-shadow: 0 6px 0 var(--wood-shadow), inset 0 3px 0 rgba(255, 255, 255, 0.35);
    padding: 22px 28px 24px;
    text-align: center;
    display: grid;
    gap: 12px;
    min-width: 230px;
  }
  #mTitle { margin: 0; font-weight: 800; font-size: 34px; letter-spacing: 0.06em; }
  #mSub { margin: 0; color: var(--ink-edge); font-weight: 700; font-size: 14px; }
  .gobtn {
    font: inherit;
    font-weight: 800;
    font-size: 18px;
    color: var(--ink);
    text-shadow: 0 2px 0 var(--go-deep);
    background: linear-gradient(#78e063, var(--go));
    border: 3px solid var(--go-deep);
    border-radius: 999px;
    box-shadow: 0 4px 0 var(--go-deep);
    padding: 10px 22px;
    cursor: pointer;
  }
  .gobtn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--go-deep); }
  .gobtn:disabled { filter: saturate(0.4); cursor: progress; }
  /* 知らせはヒントと設定のボタンより前に出す(押した指はそのまま下のボタンに届く) */
  #toast {
    position: absolute;
    z-index: 2;
    top: 8px;
    left: 50%;
    transform: translateX(-50%);
    box-sizing: border-box;
    width: min(100%, 360px);
    padding: 8px 14px;
    border-radius: 14px;
    background: rgba(35, 14, 2, 0.82);
    color: #fff4dc;
    font-weight: 700;
    font-size: 13px;
    line-height: 1.5;
    text-align: center;
    pointer-events: none;
  }
  .subbtn {
    font: inherit;
    font-weight: 800;
    font-size: 15px;
    color: var(--ink-edge);
    background: rgba(255, 244, 225, 0.55);
    border: 3px solid var(--wood-edge);
    border-radius: 999px;
    padding: 8px 18px;
    cursor: pointer;
  }
  .pickHead { margin: 0; font-weight: 800; font-size: 30px; letter-spacing: 0.06em; }
  #pickNote { margin: 0; color: var(--ink-edge); font-weight: 700; font-size: 13px; }
  .pickbtn {
    font: inherit;
    font-weight: 800;
    font-size: 18px;
    color: var(--ink);
    text-shadow: 0 2px 0 var(--wood-shadow);
    background: linear-gradient(#f0a95c, #d0802f);
    border: 3px solid var(--wood-edge);
    border-radius: 16px;
    box-shadow: 0 4px 0 var(--wood-shadow);
    padding: 8px 18px;
    display: grid;
    gap: 2px;
    cursor: pointer;
  }
  .pickbtn small { font-size: 12px; font-weight: 700; text-shadow: none; color: #fff4dc; }
  /* 難しさのボタン: 左に丸い顔、右に名前と説明 */
  .pickbtn[data-diff] { grid-template-columns: 44px 1fr; column-gap: 10px; align-items: center; padding-left: 10px; }
  .pickbtn[data-diff] > span, .pickbtn[data-diff] > small { grid-column: 2; }
  .pickface {
    grid-row: span 2;
    width: 44px;
    height: 44px;
    box-sizing: border-box;
    border: 2.5px solid #fff4dc;
    border-radius: 50%;
    background: radial-gradient(circle at 50% 40%, #fff8ea, #ffd98f);
    object-fit: cover;
    box-shadow: 0 2px 0 var(--wood-shadow);
  }
  .pickbtn.on { background: linear-gradient(#78e063, var(--go)); border-color: var(--go-deep); box-shadow: 0 4px 0 var(--go-deep); }
  .pickbtn:active, .subbtn:active { transform: translateY(3px); }
  /* 設定(歯車は盤面の右上。見出しの帯には3つ目のボタンを置く幅が無い) */
  #gear, #hintBtn { position: absolute; top: 2px; width: 36px; height: 36px; }
  #gear { right: 0; }
  #hintBtn { left: 0; }
  #gear svg, #hintBtn svg { width: 20px; height: 20px; }
  #hintBtn:disabled { filter: saturate(0.4); cursor: progress; }
  /* クリアの評価: 星3つと、時間・ヒント・戻るの回数・自己ベスト */
  #mStars { display: flex; justify-content: center; gap: 6px; font-size: 38px; line-height: 1; }
  #mStars span { color: rgba(90, 45, 12, 0.45); text-shadow: 0 2px 0 rgba(255, 255, 255, 0.25); }
  #mStars span.on { color: var(--gold); text-shadow: 0 0 10px rgba(255, 226, 122, 0.7), 0 3px 0 #8a5600; animation: starPop 0.4s cubic-bezier(.2, 1.7, .4, 1) both; }
  @keyframes starPop { 0% { transform: scale(0.2); } 100% { transform: none; } }
  #mStat { margin: 0; color: var(--ink-edge); font-weight: 700; font-size: 13px; line-height: 1.6; font-variant-numeric: tabular-nums; white-space: pre-line; }
  .setLabel { margin: 0; font-weight: 800; font-size: 15px; color: var(--ink-edge); text-align: left; }
  /* 紙吹雪を重ねる透明なキャンバス。クリア画面の上にも降らせる */
  #fx { position: fixed; inset: 0; pointer-events: none; z-index: 20; }
  /* 派手め: クリアで盤面が揺れる */
  #stage.shake { animation: shake 0.45s linear; }
  @keyframes shake {
    0%, 100% { transform: none; }
    15% { transform: translate(-7px, 3px) rotate(-0.6deg); } 30% { transform: translate(6px, -4px) rotate(0.5deg); }
    45% { transform: translate(-5px, -2px); } 60% { transform: translate(4px, 3px); } 80% { transform: translate(-2px, 1px); }
  }
  /* クリアの文字は弾んで出る。コインは光る */
  #mTitle.pop { animation: titlePop 0.62s cubic-bezier(.2, 1.6, .4, 1) both; }
  #mTitle.popSoft { animation: titlePopSoft 0.45s ease-out both; }
  #mTitle.popMega { animation: titlePopMega 0.8s cubic-bezier(.2, 1.5, .4, 1) both, titleGlow 1.2s ease-in-out 0.8s 2; }
  @keyframes titlePopMega { 0% { transform: scale(0) rotate(-25deg); opacity: 0; } 55% { transform: scale(1.5) rotate(6deg); opacity: 1; } 75% { transform: scale(0.92) rotate(-2deg); } 100% { transform: none; } }
  @keyframes titleGlow { 50% { filter: drop-shadow(0 0 10px #ffe27a) brightness(1.15); } }
  @keyframes titlePop { 0% { transform: scale(0.2) rotate(-8deg); opacity: 0; } 60% { transform: scale(1.22) rotate(3deg); opacity: 1; } 100% { transform: none; } }
  @keyframes titlePopSoft { 0% { transform: scale(0.7); opacity: 0; } 100% { transform: none; opacity: 1; } }
  .coin.glow { animation: coinGlow 1.6s ease-in-out; }
  @keyframes coinGlow {
    0%, 100% { transform: none; filter: none; }
    20%, 60% { transform: scale(1.35); filter: brightness(1.35) drop-shadow(0 0 8px #ffe27a); }
    40%, 80% { transform: scale(1.1); filter: brightness(1.1) drop-shadow(0 0 3px #ffe27a); }
  }
  /* キャラ: クリアと詰みの画面ではカードの上に立ち、ヒントと戻るでは知らせの横に顔を出す */
  .mbox { display: grid; justify-items: center; }
  #mChara {
    position: relative;
    z-index: 1;
    height: min(170px, 22vh);
    margin-bottom: -18px;                 /* 足元をカードの縁に少し重ねる */
    transform-origin: 50% 100%;
    filter: drop-shadow(0 4px 0 rgba(60, 25, 5, 0.4));
    pointer-events: none;
  }
  #mChara.in { animation: charaIn 0.5s cubic-bezier(.2, 1.5, .4, 1) both; }
  #mChara.hop { animation: charaIn 0.5s cubic-bezier(.2, 1.5, .4, 1) both, charaHop 0.5s ease-in-out 0.55s 3; }
  #mChara.sag { animation: charaSag 0.7s ease-out both; }
  @keyframes charaIn { 0% { transform: translateY(24px) scale(0.6); opacity: 0; } 100% { transform: none; opacity: 1; } }
  @keyframes charaHop { 50% { transform: translateY(-16px) scale(1.03, 0.97); } }
  @keyframes charaSag { 0% { transform: translateY(-12px); opacity: 0; } 100% { transform: none; opacity: 1; } }
  #toast.face { padding-left: 58px; text-align: left; }
  #toastFace {
    position: absolute;
    left: 4px;
    top: 50%;
    width: 50px;
    height: 50px;
    margin-top: -25px;
    box-sizing: border-box;
    border: 3px solid #fff4dc;            /* 丸い顔アイコン。切り抜きの下端の直線を見せない */
    border-radius: 50%;
    background: radial-gradient(circle at 50% 40%, #fff8ea, #ffd98f);
    object-fit: cover;
    box-shadow: 0 2px 0 rgba(0, 0, 0, 0.35);
  }
  #toastFace.in { animation: faceIn 0.4s cubic-bezier(.2, 1.7, .4, 1) both; }
  @keyframes faceIn { 0% { transform: scale(0.3) rotate(-15deg); } 100% { transform: none; } }
  @media (prefers-reduced-motion: reduce) {
    .woodbtn:active, .gobtn:active, .pickbtn:active, .subbtn:active { transform: none; }
    #mTitle.pop, #mTitle.popSoft, #mTitle.popMega, .coin.glow, #mStars span.on, #stage.shake { animation: none; }
    #mChara.in, #mChara.hop, #mChara.sag, #toastFace.in { animation: none; }
  }
</style>

<div id="app">
  <header id="hud">
    <div class="tools">
    <button id="retry" class="woodbtn" type="button" aria-label="やり直し">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M19 12a7 7 0 1 1-2.05-4.95" fill="none" stroke="#fff8ea" stroke-width="3.2" stroke-linecap="round"/>
        <path d="M19.5 3.5v5h-5" fill="none" stroke="#fff8ea" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <button id="dice" class="woodbtn" type="button" aria-label="ランダムな盤面で遊ぶ">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <rect x="3.5" y="3.5" width="17" height="17" rx="4" fill="none" stroke="#fff8ea" stroke-width="2.6"/>
        <circle cx="8.6" cy="8.6" r="1.7" fill="#fff8ea"/><circle cx="15.4" cy="8.6" r="1.7" fill="#fff8ea"/>

    </div>
    <div id="title" class="outlined"><span id="tMain">ステージ 1</span><span id="tSub" hidden></span></div>

  <div id="stage">

      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.2 1 2V17h5.2v-1.2c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z" fill="none" stroke="#fff8ea" stroke-width="2.2" stroke-linejoin="round"/>
        <path d="M9.6 20h4.8" stroke="#fff8ea" stroke-width="2.2" stroke-linecap="round"/>
      </svg>
    </button>

      <svg viewBox="0 0 24 24" aria-hidden="true">

        <circle cx="12" cy="12" r="3.2" fill="none" stroke="#fff8ea" stroke-width="2.4"/>

    <div id="modal" hidden>

<!-- 紙吹雪用。揺れる #stage の外に置く(変形する親の中だと position: fixed が画面に固定されない) -->
<canvas id="fx"></canvas>

<script>
(() => {
  const { Engine, Bodies, Body, Composite, Constraint, Vertices, Common } = Matter;
  Common.setDecomp(window.decomp);

  // ---- 定数 ----
  const W = 400, H = 716;
  const TAU = Math.PI * 2, DEG = Math.PI / 180;
  const SR = 13;          // ねじ半径
  const HR = 11.5;        // 板のねじ穴の半径
  const GAP = 34;         // ねじ同士の最小間隔(中心間)
  const EDGE = 20;        // ねじ穴の中心から板の縁までに残す幅
  const LINE = 3.8;       // 板の縁取りの太さ
  const ACTIVE = 2;       // 同時に出る箱の数
  const BUF = 5;          // 待機スロット数
  const FLY = 0.38;       // ねじが飛ぶ時間(秒)
  const NUDGE_W = 0.004;  // 倒立の釣り合いから押し出すときの最低回転速度(rad/ステップ、約0.24rad/秒)
  const NUDGE_ANGLE = 0.3;  // この角度だけ傾いたら押すのをやめ、あとは重力に任せる(rad)
  const BOARD = { x0: 8, x1: 392, y0: 164, y1: 710 };   // 板を置いてよい範囲
  const COLOR_DEPTH = 5;  // 最上階層から何段目までねじの色が見え、触れるか
  const SHAPE_DEPTH = 6;  // 何段目まで板の形が見えるか(6段目は形だけで、ねじの色は分からない)
  const TIER_GAP = 6;     // 同じ階層の板どうしのすき間。同じ階層の板は衝突するので重ねて置かない
  const MAX_PLATES = 36;  // 1ステージの板の上限
  const MAX_HOLES = 4;    // 1枚の板のねじ穴の上限(ねじの総数を抑えつつ階層を増やす)
  const SCREW_CAP = 75;   // 1ステージのねじの上限
  const PLATE_SCALE = [1.3, 1.55];   // 板の形の拡大率(下の SHAPES の寸法に掛ける)。市販アプリのように盤面に対して大きな板にする
  const MAX_OVER = 0.9;   // 下の階層の板と重なる割合の上限(大きな板は下とよく重なる)
  const SNUG = 18;        // 同じ階層の2枚目以降は、先に置いた板とのすき間がこれ以下になる位置を優先する
  const colorsFor = lv => Math.min(5 + Math.floor((lv - 1) / 3), 9);   // ねじの色数: ステージ1〜3で5色、3ステージごとに+1、13以降9色(用意は10色)
  const tierGoal = lv => Math.min(7 + Math.floor((lv - 1) / 3), 9);    // 階層の目標段数(ステージ1〜3で7段、4〜6で8段、7以降9段。ねじ60本前後で盤面が埋まるので10段以上は入りにくい)
  const DENSITY = 0.001, INERTIA_SCALE = 4;              // Matter.js の既定値(密度、慣性モーメントの倍率)に合わせる

  const COLORS = [
    { c: '#3fd46a', d: '#12813a' },   // 緑
    { c: '#2ec4f1', d: '#0a6d95' },   // 水色
    { c: '#f04fae', d: '#961866' },   // 桃
    { c: '#ffd23c', d: '#b07f00' },   // 黄
    { c: '#ff8a2a', d: '#ad4805' },   // 橙

    return out;
  }
  // ねじ穴は置く位置を決めてから選ぶ。候補点のうち、盤面のほかのねじ穴から GAP 以上離れた点を、互いにできるだけ離して
  // 形が決めた数(sh.nh)まで。1つ目は形の中心から一番遠い点、以降は選んだ穴から一番遠い点(端から埋まっていく)。
  // 穴の位置を形に固定すると、大きな板は混んだ盤面のほぼどこに置いても既存のねじ穴とぶつかる
  function chooseHoles(pl, plates) {
    const sh = pl.sh, others = [];
    for (const q of plates) for (const a of q.holesW) if (len(a[0] - pl.cx, a[1] - pl.cy) < pl.r + GAP) others.push(a[0], a[1]);
    const free = [], c = Math.cos(pl.ang), sn = Math.sin(pl.ang);
    for (const s of sh.sites) {
      const x = pl.x + s[0] * c - s[1] * sn, y = pl.y + s[0] * sn + s[1] * c;
      let ok = true;
      for (let k = 0; k < others.length && ok; k += 2) ok = (others[k] - x) ** 2 + (others[k + 1] - y) ** 2 >= GAP * GAP;
      if (ok) free.push(s);
    }
    const out = [];
    let dist = free.map(s => len(s[0] - sh.c[0], s[1] - sh.c[1]));
    while (out.length < sh.nh) {
      let k = -1;
      for (let i = 0; i < free.length; i++) if (k < 0 || dist[i] > dist[k]) k = i;
      if (k < 0 || (out.length && dist[k] < GAP)) break;
      const h = free[k];
      out.push(h);
      dist = dist.map((d, i) => out.length === 1 ? len(free[i][0] - h[0], free[i][1] - h[1]) : Math.min(d, len(free[i][0] - h[0], free[i][1] - h[1])));
    }
    return out.length >= 2 ? out : null;
  }

  // 同じ階層の板とのすき間(粗い格子点での概算。格子の目の分だけ実際より大きめに出る)
  function gapTo(pl, pts, mates) {
    let g = Infinity;
    for (const q of mates) {
      if (!near(pl, q, SNUG * 2)) continue;
      for (const [px, py] of pts) {
        const [x, y] = place(pl, px, py), l = unplace(q, x, y);
        g = Math.min(g, q.sh.f(l[0], l[1]));
      }
    }
    return g;
  }

  // 板を下の階層から置いていき、ねじの総数を3の倍数にそろえる。tb は下から数えた階層。
  // 階層ごとに枚数(序盤は2枚、ステージ4からは2〜3枚)を先に決め、その枚数まで形と位置を変えて粘る
  function placePlates(lv, rnd) {
    const maxCover = Math.min(3 + Math.floor(lv / 3), 6);
    const goal = tierGoal(lv);
    const plates = [];
    let grid = newGrid();
    let S = 0, tb = 0, emptyTiers = 0;
    while (tb < goal && S < SCREW_CAP && plates.length < MAX_PLATES && emptyTiers < 3) {
      const want = 2 + (lv >= 4 && rnd() < 0.5 ? 1 : 0);
      let placed = 0, misses = 0;
      // ねじの上限に達しても、階層は最低2枚まで埋める
      while (placed < want && (S < SCREW_CAP || placed < 2) && plates.length < MAX_PLATES && misses < 14) {
        const sh = makeShape(rnd);
        if (!sh) { misses++; continue; }
        const pts = coarse(sh), sp = spanOf(pts);
        sh.sites = holeSites(sh); sh.nh = sh.holes.length; sh.c = [sp.cx, sp.cy];
        const mates = plates.filter(q => q.tb === tb);
        // 同じ階層に先客がいれば、そのすぐ隣を狙って置く(回ったり落ちたりした板が隣の板に当たって止まるように)。
        // 置ける位置のうち、先客とのすき間が一番小さいものを選ぶ
        let ok = null, best = Infinity, found = 0;
        for (let k = 0; k < 40 && found < 4; k++) {
          const ang = rnd() * TAU, c = rot(sp.cx, sp.cy, ang), e = extent(sp.rim, ang);
          // 盤面からはみ出さない原点の範囲
          const xlo = BOARD.x0 - e[0] + 0.5, xhi = BOARD.x1 - e[2] - 0.5, ylo = BOARD.y0 - e[1] + 0.5, yhi = BOARD.y1 - e[3] - 0.5;
          if (xlo > xhi || ylo > yhi) continue;
          let cx, cy;
          if (mates.length && k % 3 !== 2) {
            const m = mates[Math.floor(rnd() * mates.length)], a = rnd() * TAU, d = (m.r + sp.r) * U(rnd, 0.5, 0.95);
            cx = m.cx + Math.cos(a) * d; cy = m.cy + Math.sin(a) * d;
          } else {
            const spread = !plates.length ? 0.3 : tb === 0 ? 0.7 : 1;
            cx = 200 + (rnd() * 2 - 1) * 130 * spread; cy = 437 + (rnd() * 2 - 1) * 190 * spread;
          }
          const x = Math.min(xhi, Math.max(xlo, cx - c.x)), y = Math.min(yhi, Math.max(ylo, cy - c.y));
          const pl = { sh, tb, ang, x, y, cx: x + c.x, cy: y + c.y, r: sp.r };
          if (!fits(pl, pts, plates, grid, maxCover, rnd)) continue;
          found++;
          const g = mates.length ? gapTo(pl, pts, mates) : 0;
          if (g < best) { best = g; ok = pl; }
          if (g <= SNUG) break;
        }
        if (!ok) { misses++; continue; }
        sh.holes = ok.hs;
        ok.holesW = sh.holes.map(h => place(ok, h[0], h[1]));
        ok.wp = pts.map(p => place(ok, p[0], p[1]));
        ok.pts = pts;
        plates.push(ok);
        stamp(grid, ok);
        placed++;
        S += sh.holes.length;
      }
      if (placed === 1) {                        // 1枚しか入らなかった階層は取り消す(一番下の階層も)
        S -= plates.pop().sh.holes.length;
        placed = 0;
        grid = newGrid();
        plates.forEach(q => stamp(grid, q));
      }
      if (placed) { tb++; emptyTiers = 0; } else emptyTiers++;
    }
    // ねじの総数を、上限以下の3の倍数にそろえる(穴の多い板から1つずつ減らす)
    while (S % 3 !== 0 || S > SCREW_CAP) {
      let best = null;
      for (const p of plates) if (p.sh.holes.length > 2 && (!best || p.sh.holes.length > best.sh.holes.length)) best = p;
      if (best) { best.sh.holes.pop(); best.holesW.pop(); S--; }
      else if (S % 3 !== 0 && plates.length > 1) S -= plates.pop().sh.holes.length;
      else break;
    }
    return { plates, S, tiers: new Set(plates.map(p => p.tb)).size };
  }

  function genLevel(lv, seed) {
    // 配置が早く行き詰まって目標の段数に届かなかったら、種を変えて作り直す(同じ番号なら同じ盤面)
    const goal = tierGoal(lv);
    let pick = null, last = null;
    for (let k = 0; k < 8; k++) {
      const rnd = mulberry32(seed + k * 104729);
      const g = placePlates(lv, rnd);
      g.rnd = rnd;
      last = g;
      const ok = g.S % 3 === 0 && g.S >= 9 && g.plates.length >= 3;
      if (ok && (!pick || g.tiers > pick.tiers || (g.tiers === pick.tiers && g.S > pick.S))) pick = g;
      if (pick && pick.tiers >= goal) break;
    }
    const { plates, S, rnd } = pick || last;
    // 階層は上から 0, 1, 2 …(空いた階層は詰める)
    const tbs = [...new Set(plates.map(p => p.tb))].sort((a, b) => b - a);
    plates.forEach(p => { p.tier = tbs.indexOf(p.tb); });
    const nColors = colorsFor(lv);

    // 箱の順番を先に決め、上の階層のねじほど早い箱の色になるよう、階層をまたいで混ぜながら割り当てる。
    // 解ける手順があり、しかも手なりでは解けない割り当てを探す(ステージが進むほど厳しく)
    const palette = shuffle(COLORS.map((_, i) => i), rnd).slice(0, nColors);
    const boxQueue = [];
    for (let i = 0; i < S / 3; i++) boxQueue.push(palette[i % nColors]);
    shuffle(boxQueue, rnd);
    const list = [];
    plates.forEach((p, li) => p.sh.holes.forEach((h, hi) => list.push({ pl: li, hi, tier: p.tier, x: p.holesW[hi][0], y: p.holesW[hi][1] })));
    const model = buildModel(plates, list);
    const hard = lv >= 5 ? 2 : lv >= 2 ? 1 : 0;   // 0: 解ければよい 1: 上から順に外すだけでは解けない 2: さらに手なりでも解けない
    const win = Math.min(5 + lv, 14), noise = Math.min(1.5 + lv * 0.1, 3);
    let choice = null, spare = null, tries = 0;
    for (; tries < TRY_ASSIGN && !choice; tries++) {
      assignColors(list, boxQueue, win, noise, rnd);
      const easy = (hard >= 1 && solvable(list, boxQueue)) || (hard >= 2 && greedyPlay(plates, list, boxQueue, model));
      if (easy && spare) continue;               // 易しい割り当ての控えは1つで足りる
      const path = solveFull(plates, list, boxQueue, model, SOLVE_BUDGET);
      if (!path) continue;
      const rec = { colors: list.map(x => x.color), path, easy };
      if (easy) spare = rec; else choice = rec;
    }
    if (!choice) choice = spare;
    if (!choice) {                                  // 最後の砦: 混ぜない割り当て。上から順に外すだけで必ず解ける
      assignColors(list, boxQueue, 1, 0, rnd);
      choice = { colors: list.map(x => x.color), path: solveOrder(list, boxQueue), easy: true, fallback: true };
    }
    list.forEach((x, i) => { x.color = choice.colors[i]; });
    genStats = { tries, hard, easy: choice.easy, fallback: !!choice.fallback, path: choice.path };
    const tints = shuffle(TINTS.slice(), rnd);                 // 同じ階層の板は同じ色
    plates.forEach(p => { p.tint = tints[p.tier % tints.length]; });
    return { plates, screws: list, queue: boxQueue, rnd, model };
  }

  // 箱の色の並び(1箱3本)を窓の中で混ぜ、上の階層ほど前の色を割り当てる。noise は階層をまたぐ混ざり具合
  function assignColors(list, queue, win, noise, rnd) {
    const L = queue.flatMap(c => [c, c, c]);
    for (let i = 0; i < L.length; i++) {
      const j = i + Math.floor(rnd() * Math.min(win, L.length - i));
      [L[i], L[j]] = [L[j], L[i]];
    }
    for (const s of list) s.key = -s.tier + rnd() * noise;
    list.slice().sort((a, b) => b.key - a.key).forEach((s, i) => { s.color = L[i]; });
  }

  // ---- 解けるかの判定 ----
  // 「最上階層のねじから順に外す」手順だけを試す。この手順で外すねじは常に最上階層にあり、
  // 上の階層はねじ0本で板が落ちていくだけなので、板がどう揺れても隠れず、色も見えている(物理に左右されない)。
  // 揺れている板の下を先に掘れるかどうかは揺れ方しだいの近道なので、判定には使わない。
  // 各階層の中では、合う箱があるねじを先に入れ、無ければ次に出る箱で一番早く要る色を待機スロットへ置く。
  // 待機スロットがあふれずに全部の箱が埋まれば解ける。実際のゲームでもこの順に外せば必ずクリアできる
  function solveOrder(list, queue) {
    const tiers = [];
    list.forEach((s, i) => { (tiers[s.tier] = tiers[s.tier] || []).push(i); });
    const q = queue.slice(), boxes = [], buf = [], order = [];
    const spawn = () => {
      while (boxes.length < ACTIVE && q.length) {
        const b = { color: q.shift(), n: 0 };
        boxes.push(b);
        for (let i = buf.length - 1; i >= 0 && b.n < 3; i--) if (buf[i] === b.color) { buf.splice(i, 1); b.n++; }
        if (b.n === 3) boxes.splice(boxes.indexOf(b), 1);
      }
    };
    const need = c => { const i = q.indexOf(c); return i < 0 ? Infinity : i; };
    spawn();
    for (const rem of tiers) {
      if (!rem) continue;
      while (rem.length) {
        let i = rem.findIndex(k => boxes.some(b => b.color === list[k].color));
        if (i >= 0) {
          const k = rem.splice(i, 1)[0];
          let b = null;                           // 同じ色の箱が2つなら多く入っている方(ゲームの openBoxFor と同じ)
          for (const x of boxes) if (x.color === list[k].color && (!b || x.n > b.n)) b = x;
          order.push(k);
          if (++b.n === 3) { boxes.splice(boxes.indexOf(b), 1); spawn(); }
          continue;
        }
        if (buf.length >= BUF) return null;
        i = 0;
        for (let j = 1; j < rem.length; j++) if (need(list[rem[j]].color) < need(list[rem[i]].color)) i = j;
        const k = rem.splice(i, 1)[0];
        order.push(k);
        buf.push(list[k].color);
      }
    }
    return !boxes.length && !q.length && !buf.length ? order : null;
  }
  const solvable = (list, queue) => solveOrder(list, queue) !== null;

  // ---- 解けるかの判定(見えていて外せるねじ全部が手の候補) ----
  // 板の動きは安全側に見積もる。前提は「揺れや落下が落ち着いてから次のねじを外す」。この見積もりで外せる手順は、実際のゲームでも外せる
  //  ・ねじ2本以上の板は動かないので、置いた位置の形で隠す(判定の輪はゲームより 2 大きい)
  //  ・1本留めの板は、重心が真下へ向かう向きに回る。同じ階層でねじ2本以上の板(動かない)に当たればそこで止まり、
  //    当たらなければ真下に垂れて止まる。その止まった姿勢(前後に1刻みの余裕)で隠す。
  //    同じ階層にぶら下がっている板や引っかかった板があって互いに押し合いうるとき、重心が支点のほぼ真上のとき
  //    (倒れる向きが決まらない)は、残ったねじを中心に板が届く円の中をすべて隠すとみなす
  //  ・ねじ0本の板は、止まっていた姿勢からまっすぐ下へ落ちる。その途中に、同じ階層でねじの残った板(2本以上なら置いた形、
  //    1本なら届く円)があれば引っかかったとする。無ければ落ちきって何も隠さない(ねじ0本どうしはぶつからない)。
  //    引っかかった板は、落ち始めた高さより下のねじを盤面の幅いっぱい隠す。乗った先から滑り落ちてまた別の板に乗ることもあるので、
  //    たどりうる板(catchers)のねじが全部外れるまで引っかかったままとみなす
  const TRY_ASSIGN = 30;      // 色の割り当てを試す回数
  const SOLVE_BUDGET = 6000;  // 手順探索の打ち切り(調べる局面の数)
  const FALL_SLIDE = 30;      // 姿勢が決まらない板が落ちるときの横へのずれの余裕
  const SWING_STEP = 10;      // 回る板の姿勢を調べる刻み(板の一番遠い点が動く距離)
  const RING_SAFE = [[0, 0]];
  for (let k = 0; k < 16; k++) RING_SAFE.push([Math.cos(k * TAU / 16) * (SR + 3), Math.sin(k * TAU / 16) * (SR + 3)]);

  // 形の格子点のうち縁にあるもの(上下左右のどれかが欠けている点)
  function rimPts(pts) {
    const key = (x, y) => Math.round(x * 2) + ',' + Math.round(y * 2), has = new Set(pts.map(([x, y]) => key(x, y)));
    return pts.filter(([x, y]) => !has.has(key(x - 7, y)) || !has.has(key(x + 7, y)) || !has.has(key(x, y - 7)) || !has.has(key(x, y + 7)));
  }

  // cov[i] = ねじ i を隠しうる上の階層の板: { q, stat: 動かないときに隠すか, disc: 1本留めで円として隠す支点(穴のビット),
  //          pose: 1本留めで止まった姿勢で隠すか(ビット h*4+j: 穴 h、止まる姿勢 j) }
  // rest[q][h] = 板 q が穴 h 1本でぶら下がったときの止まり方: { disc: true } か
  //          { mates: [{ m, j: 当たったときの姿勢(-1 = 当たらない), disc: m の円と届きあう穴のビット }], free: 真下に垂れた姿勢,
  //            poses: [{ top, stat: 落ちる途中で当たる板, discs: [{ m, bits }] }] }
  // drop[q][h] = 姿勢が決まらない板 q が穴 h を最後に外して落ちるとき、落ちる先にかかる同じ階層の板: { r, stat, disc }
  // catchers[q] = 板 q が引っかかったあと、乗り移りうる同じ階層の板。大きな板では実際には同じ階層の板全部になる
  //          (ステージ1〜40の822枚すべて)。ねじ0本どうしはぶつからないので、同じ階層のねじが全部外れれば乗る相手は残らない
  function buildModel(plates, list) {
    const cov = list.map(() => []);
    const reach = plates.map(pl => pl.holesW.map(([hx, hy]) => {
      let m = 0;
      for (const [x, y] of pl.wp) m = Math.max(m, len(x - hx, y - hy));
      return m + 12;                              // 粗い格子の目の分と縁取りと、支点のわずかな伸びの分
    }));
    const rims = plates.map(pl => rimPts(pl.pts));
    // 重心(形の座標)。ゲームの剛体と同じく、ねじ穴の分を抜く
    const com = plates.map(pl => {
      let x = 0, y = 0, n = 0;
      for (const [px, py] of pl.pts) {
        if (pl.sh.holes.some(h => len(px - h[0], py - h[1]) < HR)) continue;
        x += px; y += py; n++;
      }
      return [x / n, y / n];
    });
    // 板が届きうる範囲の横幅と一番上(どの穴でぶら下がっても)
    const fall = plates.map((pl, q) => {
      let xl = Infinity, xr = -Infinity, top = Infinity;
      pl.holesW.forEach(([hx, hy], h) => {
        xl = Math.min(xl, hx - reach[q][h]); xr = Math.max(xr, hx + reach[q][h]); top = Math.min(top, hy - reach[q][h]);
      });
      return { xl, xr, top };
    });
    const mates = plates.map((pl, q) => { const o = []; plates.forEach((r, k) => { if (k !== q && r.tier === pl.tier) o.push(k); }); return o; });
    // 円 (cx, cy, R) が帯 { xl ≤ x ≤ xr, y ≥ top } にかかるか
    const discInBand = (cx, cy, R, b) => len(cx - Math.min(b.xr, Math.max(b.xl, cx)), cy - Math.max(b.top, cy)) < R;
    // 板 r が届きうる範囲(置いた形と、穴ごとの届く円)が帯にかかるか
    const hits = (r, b) => plates[r].wp.some(([x, y]) => x >= b.xl && x <= b.xr && y >= b.top) ||
      plates[r].holesW.some(([hx, hy], h) => discInBand(hx, hy, reach[r][h], b));
    // 姿勢が決まらない板が最後の穴 h で落ちる先の帯
    const col = (q, h) => {
      const [hx, hy] = plates[q].holesW[h], R = reach[q][h];
      return { xl: hx - R - FALL_SLIDE, xr: hx + R + FALL_SLIDE, top: hy - R };
    };
    const drop = plates.map((pl, q) => pl.holesW.map((_, h) => {
      const b = col(q, h), out = [];
      for (const k of mates[q]) {
        const r = plates[k];
        const stat = r.wp.some(([x, y]) => x >= b.xl && x <= b.xr && y >= b.top);
        let disc = 0;
        r.holesW.forEach(([hx, hy], hr) => { if (discInBand(hx, hy, reach[k][hr], b)) disc |= 1 << hr; });
        if (stat || disc) out.push({ r: k, stat, disc });
      }
      return out;
    }));
    const catchers = plates.map((pl, q) => {
      const out = [], w = 2 * pl.r;
      const todo = [{ xl: fall[q].xl - FALL_SLIDE, xr: fall[q].xr + FALL_SLIDE, top: fall[q].top }];
      while (todo.length) {
        const b = todo.pop();
        for (const r of mates[q]) {
          if (out.includes(r) || !hits(r, b)) continue;
          out.push(r);
          todo.push({ xl: fall[r].xl - w, xr: fall[r].xr + w, top: fall[r].top - w });
        }
      }
      return out;
    });

    // 同じ階層の板の置き場所を格子に焼く(セル = 板の番号)。回る板が隣の板に当たる角度を探すのに使う
    const grids = new Map();
    const gridOf = t => {
      if (grids.has(t)) return grids.get(t);
      const g = new Int16Array(GW * GH).fill(-1);
      plates.forEach((pl, k) => {
        if (pl.tier !== t) return;
        for (const [x, y] of pl.wp) {
          const i0 = Math.round((x - BOARD.x0) / CELL), j0 = Math.round((y - BOARD.y0) / CELL);
          for (let j = j0 - 1; j <= j0 + 1; j++) for (let i = i0 - 1; i <= i0 + 1; i++) if (i >= 0 && i < GW && j >= 0 && j < GH) g[j * GW + i] = k;
        }
      });
      grids.set(t, g);
      return g;
    };
    // 板 q を穴 h のまわりに角度 a まで回したときの点 p(形の座標)の位置
    const posed = (pl, h, a, [px, py]) => {
      const H = pl.sh.holes[h], P = pl.holesW[h], c = Math.cos(a), s = Math.sin(a), x = px - H[0], y = py - H[1];
      return [P[0] + x * c - y * s, P[1] + x * s + y * c];
    };
    const rest = plates.map((pl, q) => pl.holesW.map((P, h) => {
      const H = pl.sh.holes[h], v = rot(com[q][0] - H[0], com[q][1] - H[1], pl.ang), d = len(v.x, v.y);
      let D = Math.PI / 2 - Math.atan2(v.y, v.x);   // 重心が真下に来るまでに回る角度(短い向き)
      D = Math.atan2(Math.sin(D), Math.cos(D));
      // 重心が支点に近すぎる、または支点のほぼ真上(倒れる向きが格子の誤差で入れ替わりうる)なら姿勢を決めない
      if (d < 6 || Math.abs(v.x) < 6 && v.y < 0) return { disc: true };
      const K = Math.max(2, Math.ceil(Math.abs(D) * reach[q][h] / SWING_STEP));
      const ang = k => pl.ang + D * Math.max(0, Math.min(K, k)) / K;
      // 回っていく途中で、同じ階層の板に最初に当たる刻み
      const g = gridOf(pl.tier), hit = new Map();
      const reachable = mates[q].filter(m => len(P[0] - plates[m].cx, P[1] - plates[m].cy) < reach[q][h] + plates[m].r);
      for (let k = 1; k <= K && hit.size < reachable.length; k++) {
        for (const p of rims[q]) {
          const [x, y] = posed(pl, h, ang(k), p);
          if (x < BOARD.x0 || x > BOARD.x1 || y < BOARD.y0 || y > BOARD.y1) continue;
          const m = g[cellOf(x, y)];
          if (m >= 0 && m !== q && !hit.has(m)) hit.set(m, k);
        }
      }
      const ks = [...new Set([...hit.values(), K])].sort((a, b) => a - b);
      if (ks.length > 4) return { disc: true };  // 姿勢の番号は穴ごとに4つまで(cov の pose ビット)
      // 止まる姿勢 j: 刻み k の前後(当たったなら k-2 〜 k+1、垂れたなら K-1 〜 K)の角度
      const spans = ks.map(k => k === K && ![...hit.values()].includes(K) ? [K - 1, K] : [k - 2, k - 1, k, k + 1]);
      const poses = spans.map(span => {
        let top = Infinity;
        const low = new Map();                    // 8 ごとの縦の列ごとの一番下
        for (const k of span) {
          for (const p of rims[q]) top = Math.min(top, posed(pl, h, ang(k), p)[1]);
          for (const p of pl.pts) {
            const [x, y] = posed(pl, h, ang(k), p), b = Math.round(x / 8);
            for (const bb of [b - 1, b, b + 1]) low.set(bb, Math.max(low.get(bb) ?? -Infinity, y));
          }
        }
        let xl = Infinity, xr = -Infinity;
        for (const b of low.keys()) { xl = Math.min(xl, b * 8); xr = Math.max(xr, b * 8); }
        const stat = [], discs = [];
        for (const m of mates[q]) {
          if (plates[m].wp.some(([x, y]) => y > (low.get(Math.round(x / 8)) ?? Infinity))) stat.push(m);
          let bits = 0;
          plates[m].holesW.forEach(([hx, hy], hm) => { if (discInBand(hx, hy, reach[m][hm], { xl: xl - 8, xr: xr + 8, top })) bits |= 1 << hm; });
          if (bits) discs.push({ m, bits });
        }
        return { top, stat, discs, span };
      });
      const ms = mates[q].map(m => {
        let disc = 0;
        plates[m].holesW.forEach(([hx, hy], hm) => { if (len(hx - P[0], hy - P[1]) < reach[q][h] + reach[m][hm]) disc |= 1 << hm; });
        return { m, j: hit.has(m) ? ks.indexOf(hit.get(m)) : -1, disc };
      });
      return { mates: ms, free: ks.length - 1, poses, ang };
    }));

    plates.forEach((pl, q) => {
      list.forEach((s, i) => {
        if (s.tier <= pl.tier) return;
        const l = unplace(pl, s.x, s.y);
        const stat = RING_SAFE.some(([ox, oy]) => pl.sh.f(l[0] + ox, l[1] + oy) < 0);
        let disc = 0, pose = 0;
        pl.holesW.forEach(([hx, hy], h) => {
          if (len(s.x - hx, s.y - hy) >= reach[q][h] + SR + 3) return;
          disc |= 1 << h;
          const rt = rest[q][h];
          if (rt.disc) return;
          // 姿勢の刻みの間で点が動くのは SWING_STEP 以内なので、その半分を余裕に足す
          const H = pl.sh.holes[h];
          rt.poses.forEach((p, j) => {
            if (p.span.some(k => {
              const a = rt.ang(k), c = Math.cos(a), sn = Math.sin(a), dx = s.x - hx, dy = s.y - hy;
              return pl.sh.f(H[0] + dx * c + dy * sn, H[1] - dx * sn + dy * c) < SR + 4 + SWING_STEP / 2;
            })) pose |= 1 << (h * 4 + j);
          });
        });
        if (stat || disc) cov[i].push({ q, stat, disc, pose });
      });
    });
    return { cov, drop, catchers, rest, col };
  }

  // 盤面の数え上げ用の模擬(物理なし)。apply で1本外し、save/restore で戻す
  function makeSim(plates, list, queue, model) {
    const { cov, drop, catchers, rest, col } = model;
    const N = list.length;
    const T = list.reduce((m, s) => Math.max(m, s.tier), 0) + 1;
    const st = {
      left: plates.map(pl => (1 << pl.sh.holes.length) - 1),   // 板ごとに残っている穴(ビット)
      removed: new Uint8Array(N), tierLeft: new Int32Array(T),
      hungTop: new Float64Array(plates.length).fill(Infinity),   // ねじ0本で引っかかった板の、落ち始めた高さ(Infinity = 引っかかっていない)
      nHung: 0,
      wild: new Uint8Array(plates.length),   // ぶら下がっている間に、ほかの動く板と押し合いうる状態になった板(以後は姿勢を決めない)
      boxes: [], qi: 0, buf: new Array(COLORS.length).fill(0), bufN: 0, done: 0,
    };
    list.forEach(s => { st.tierLeft[s.tier]++; });
    const bits = m => (m & 1) + (m >> 1 & 1) + (m >> 2 & 1) + (m >> 3 & 1) + (m >> 4 & 1);
    const topTier = () => { for (let t = 0; t < T; t++) if (st.tierLeft[t]) return t; return T; };
    // 引っかかった板は、乗り移りうる板にねじが残っている間は引っかかったまま
    const caught = q => st.hungTop[q] < Infinity && catchers[q].some(r => st.left[r]);
    // 穴 h 1本でぶら下がった板 q が止まる姿勢(-1 = 決まらないので円で隠す)
    const restOf = (q, h) => {
      const rt = rest[q][h];
      if (rt.disc || st.wild[q]) return -1;
      let j = rt.free;
      for (const e of rt.mates) {
        const m = st.left[e.m], n = bits(m);
        if (n >= 2) { if (e.j >= 0 && e.j < j) j = e.j; }
        else if (n === 1) { if (e.disc & m) return -1; }
        else if (caught(e.m)) return -1;
      }
      return j;
    };
    const blocked = i => {
      for (const c of cov[i]) {
        const m = st.left[c.q], n = bits(m);
        if (n >= 2) { if (c.stat) return true; }
        else if (n === 1) {
          const h = 31 - Math.clz32(m), j = restOf(c.q, h);
          if (j < 0 ? c.disc >> h & 1 : c.pose >> (h * 4 + j) & 1) return true;
        }
      }
      if (st.nHung) {
        const s = list[i];
        for (let q = 0; q < plates.length; q++) {
          if (st.hungTop[q] < Infinity && plates[q].tier < s.tier && s.y + SR + 3 >= st.hungTop[q] && caught(q)) return true;
        }
      }
      return false;
    };
    // 板 q が穴 h の最後のねじを外されて落ちるとき、引っかかるなら落ち始めた高さ(引っかからなければ Infinity)
    const landTop = (q, h) => {
      const j = restOf(q, h);
      if (j < 0) {
        const hit = drop[q][h].some(e => { const m = st.left[e.r], n = bits(m); return n >= 2 ? e.stat : n === 1 && (e.disc & m); });
        return hit ? col(q, h).top : Infinity;
      }
      const p = rest[q][h].poses[j];
      const hit = p.stat.some(m => bits(st.left[m]) >= 2) || p.discs.some(e => bits(st.left[e.m]) === 1 && (e.bits & st.left[e.m]));
      return hit ? p.top : Infinity;
    };
    const avail = () => {
      const t0 = topTier(), out = [];
      for (let i = 0; i < N; i++) if (!st.removed[i] && list[i].tier - t0 < COLOR_DEPTH && !blocked(i)) out.push(i);
      return out;
    };
    const spawn = () => {
      while (st.boxes.length < ACTIVE && st.qi < queue.length) {
        const b = { c: queue[st.qi++], n: 0 };
        const take = Math.min(3, st.buf[b.c]);
        st.buf[b.c] -= take; st.bufN -= take; b.n = take;
        if (b.n < 3) st.boxes.push(b);
      }
    };
    const openFor = c => {                        // 同じ色の箱が2つなら多く入っている方(ゲームの openBoxFor と同じ)
      let best;
      for (const b of st.boxes) if (b.c === c && (!best || b.n > best.n)) best = b;
      return best;
    };
    const apply = i => {                          // false = 合う箱が無く待機スロットも満杯
      const c = list[i].color, b = openFor(c);
      if (!b && st.bufN >= BUF) return false;
      const q = list[i].pl, top = st.left[q] === 1 << list[i].hi ? landTop(q, list[i].hi) : Infinity;
      st.removed[i] = 1; st.left[q] &= ~(1 << list[i].hi); st.tierLeft[list[i].tier]--; st.done++;
      if (top < Infinity) { st.hungTop[q] = top; st.nHung++; }
      // 同じ階層でぶら下がっている板のうち、この手でほかの動く板と押し合いうるようになったものは、以後の姿勢を決めない
      for (let r = 0; r < plates.length; r++) {
        const m = st.left[r];
        if (!st.wild[r] && plates[r].tier === list[i].tier && m && !(m & m - 1) && restOf(r, 31 - Math.clz32(m)) < 0) st.wild[r] = 1;
      }
      if (b) { if (++b.n === 3) { st.boxes.splice(st.boxes.indexOf(b), 1); spawn(); } }
      else { st.buf[c]++; st.bufN++; }
      return true;
    };
    const save = () => ({ boxes: st.boxes.map(b => ({ c: b.c, n: b.n })), qi: st.qi, buf: st.buf.slice(), bufN: st.bufN, wild: st.wild.slice() });
    const restore = (i, sv) => {
      const q = list[i].pl;
      st.removed[i] = 0; st.left[q] |= 1 << list[i].hi; st.tierLeft[list[i].tier]++; st.done--;
      if (st.hungTop[q] < Infinity) { st.hungTop[q] = Infinity; st.nHung--; }
      st.boxes = sv.boxes; st.qi = sv.qi; st.buf = sv.buf; st.bufN = sv.bufN; st.wild = sv.wild;
    };
    const won = () => st.done === N && !st.boxes.length && st.qi === queue.length && !st.bufN;
    spawn();
    return { st, avail, apply, save, restore, won, openFor, topTier, bits };
  }

  // 手なり: 合う箱があるねじを入れ、無ければ見えている中で一番多い色を待機スロットへ(箱の順番は知らない)
  function greedyPlay(plates, list, queue, model) {
    const S = makeSim(plates, list, queue, model), st = S.st;
    while (!S.won()) {
      const A = S.avail();
      if (!A.length) return false;
      let i = A.find(k => S.openFor(list[k].color));
      if (i === undefined) {
        if (st.bufN >= BUF) return false;
        const cnt = new Array(COLORS.length).fill(0), t0 = S.topTier();
        list.forEach((s, k) => { if (!st.removed[k] && s.tier - t0 < COLOR_DEPTH) cnt[s.color]++; });
        for (let c = 0; c < cnt.length; c++) cnt[c] += 2 * st.buf[c];
        i = A.reduce((a, k) => cnt[list[k].color] > cnt[list[a].color] ? k : a, A[0]);
      }
      S.apply(i);
    }
    return true;
  }

  // 手順の探索(深さ優先、行き止まりの局面は覚えておく)。返り値: 外す順番 / false(解けない) / null(打ち切り)
  // prefix: 先に外しておく手(途中の局面から探すとき)。返す手順に prefix は含まない
  function solveFull(plates, list, queue, model, budget, prefix = []) {
    const S = makeSim(plates, list, queue, model), st = S.st, path = [], dead = new Set();
    for (const i of prefix) if (!S.apply(i)) return false;
    let nodes = 0;
    const need = c => { for (let k = st.qi; k < queue.length; k++) if (queue[k] === c) return k - st.qi; return 99; };
    const key = () => st.left.join(',') + '|' + (st.nHung ? st.hungTop.join(',') : '') + '|' + st.wild.join('') + '|' + st.qi + ':' + st.boxes.map(b => b.c + '.' + b.n).join(',') + '|' + st.buf.join('');
    // 残り3本以上の板のねじを合う箱へ入れる手は、板が動かず隠し方も変わらないので、打って損をしない。分岐させずに先に打つ
    // (入れ替えても同じ局面になる手順を何通りも調べずに済む)
    function forced() {
      const done = [];
      for (;;) {
        const i = S.avail().find(k => S.openFor(list[k].color) && S.bits(st.left[list[k].pl]) >= 3);
        if (i === undefined) return done;
        const sv = S.save();
        S.apply(i);
        done.push([i, sv]);
      }
    }
    function dfs() {
      const f = forced();
      const r = explore();
      if (r) { for (let j = f.length - 1; j >= 0; j--) path.push(f[j][0]); return true; }
      for (let j = f.length - 1; j >= 0; j--) S.restore(f[j][0], f[j][1]);
      return r;
    }
    function explore() {
      if (S.won()) return true;
      if (++nodes > budget) return null;
      const k = key();
      if (dead.has(k)) return false;
      const A = S.avail();
      const moves = A.filter(i => S.openFor(list[i].color)).sort((a, b) => list[b].tier - list[a].tier);
      if (st.bufN < BUF) {                       // 待機スロットへ置く手は、早く要る色から3色、各2本まで
        const byColor = new Map();
        for (const i of A) {
          const c = list[i].color;
          if (S.openFor(c)) continue;
          if (!byColor.has(c)) byColor.set(c, []);
          if (byColor.get(c).length < 2) byColor.get(c).push(i);
        }
        [...byColor.entries()].sort((a, b) => need(a[0]) - need(b[0])).slice(0, 3).forEach(e => moves.push(...e[1]));
      }
      for (const i of moves) {
        const sv = S.save();
        if (!S.apply(i)) continue;
        const r = dfs();
        if (r) { path.push(i); return true; }
        S.restore(i, sv);
        if (r === null) return null;
      }
      dead.add(k);
      return false;
    }
    const r = dfs();
    return r ? path.reverse() : r;
  }

  // ---- 板の輪郭と質量 ----
  // 距離関数を格子で標本化し、マーチングスクエアで輪郭線を取り出す
  function contours(v, nx, ny, x0, y0, hs) {
    const pts = new Map(), adj = new Map();
    const at = (key, xa, ya, va, xb, yb, vb) => {
      if (!pts.has(key)) {
        const t = va / (va - vb);
        pts.set(key, [xa + (xb - xa) * t, ya + (yb - ya) * t]);
      }
      return key;
    };
    const link = (a, b) => {
      if (!adj.has(a)) adj.set(a, []);
      if (!adj.has(b)) adj.set(b, []);
      adj.get(a).push(b);
      adj.get(b).push(a);
    };
    for (let j = 0; j < ny - 1; j++) for (let i = 0; i < nx - 1; i++) {
      const a = v[j * nx + i], b = v[j * nx + i + 1], c = v[(j + 1) * nx + i + 1], d = v[(j + 1) * nx + i];
      const idx = (a < 0 ? 8 : 0) | (b < 0 ? 4 : 0) | (c < 0 ? 2 : 0) | (d < 0 ? 1 : 0);
      if (idx === 0 || idx === 15) continue;
      const X = x0 + i * hs, Y = y0 + j * hs;
      const T = () => at((j * nx + i) * 2, X, Y, a, X + hs, Y, b);
      const R = () => at((j * nx + i + 1) * 2 + 1, X + hs, Y, b, X + hs, Y + hs, c);
      const B = () => at(((j + 1) * nx + i) * 2, X, Y + hs, d, X + hs, Y + hs, c);
      const Lf = () => at((j * nx + i) * 2 + 1, X, Y, a, X, Y + hs, d);
      const mid = (a + b + c + d) / 4 < 0;
      switch (idx) {
        case 1: case 14: link(Lf(), B()); break;
        case 2: case 13: link(B(), R()); break;
        case 3: case 12: link(Lf(), R()); break;
        case 4: case 11: link(T(), R()); break;
        case 6: case 9: link(T(), B()); break;
        case 7: case 8: link(Lf(), T()); break;
        case 5: if (mid) { link(Lf(), T()); link(B(), R()); } else { link(T(), R()); link(Lf(), B()); } break;
        case 10: if (mid) { link(T(), R()); link(Lf(), B()); } else { link(Lf(), T()); link(B(), R()); } break;
      }
    }
    const loops = [], seen = new Set();
    for (const start of adj.keys()) {
      if (seen.has(start)) continue;
      const loop = [];
      let prev = null, cur = start;
      while (cur !== undefined && !seen.has(cur)) {
        seen.add(cur);
        loop.push(pts.get(cur));
        const nb = adj.get(cur);
        const next = nb[0] !== prev ? nb[0] : nb[1];
        prev = cur;
        cur = next;
      }
      if (loop.length > 2) loops.push(loop);
    }
    return loops;
  }
  function simplify(loop, eps) {
    const out = [loop[0]];
    for (let i = 1; i < loop.length; i++) {
      const p = out[out.length - 1], q = loop[i], r = loop[(i + 1) % loop.length];
      const ex = r[0] - p[0], ey = r[1] - p[1];
      const d = Math.abs(ex * (q[1] - p[1]) - ey * (q[0] - p[0])) / (len(ex, ey) || 1);
      if (d > eps) out.push(q);
    }
    return out;
  }
  function buildPlate(pl) {
    const { sh } = pl;
    const step = 2, pad = 5;
    const x0 = sh.box[0] - pad, y0 = sh.box[1] - pad;
    const nx = Math.ceil((sh.box[2] - sh.box[0] + 2 * pad) / step) + 1;
    const ny = Math.ceil((sh.box[3] - sh.box[1] + 2 * pad) / step) + 1;
    const v = new Float32Array(nx * ny);
    let n = 0, sx = 0, sy = 0, sq = 0;
    for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) {
      const x = x0 + i * step, y = y0 + j * step, d = sh.f(x, y);
      v[j * nx + i] = d;
      if (d < 0 && !sh.holes.some(h => len(x - h[0], y - h[1]) < HR)) {
        n++; sx += x; sy += y; sq += x * x + y * y;
      }
    }
    const area = n * step * step, mx = sx / n, my = sy / n;
    const inertia = (sq / n - mx * mx - my * my) * area;   // 重心まわりの断面二次極モーメント(密度1)
    const path = new Path2D();
    let rad = 0, outline = null, outArea = 0;
    for (const loop of contours(v, nx, ny, x0, y0, step)) {
      let a = 0;                                   // 一番大きい輪が外周(ほかは飾り穴)
      for (let i = 0, j = loop.length - 1; i < loop.length; j = i++) a += loop[j][0] * loop[i][1] - loop[i][0] * loop[j][1];
      if (Math.abs(a) > outArea) { outArea = Math.abs(a); outline = loop; }
      simplify(loop, 0.12).forEach(([x, y], k) => {
        if (k) path.lineTo(x - mx, y - my); else path.moveTo(x - mx, y - my);
        rad = Math.max(rad, len(x - mx, y - my));
      });
      path.closePath();
    }
    const holes = sh.holes.map(h => ({ x: h[0] - mx, y: h[1] - my }));
    for (const h of holes) {
      path.moveTo(h.x + HR, h.y);
      path.arc(h.x, h.y, HR, 0, TAU);
      path.closePath();
    }
    const f = (x, y) => {
      let d = sh.f(x + mx, y + my);
      for (const h of holes) d = Math.max(d, HR - len(x - h.x, y - h.y));
      return d;
    };
    outline = simplify(outline, 1).map(([x, y]) => [x - mx, y - my]);   // 衝突判定用(重心基準)
    return { path, holes, f, rad, area, inertia, mx, my, outline };
  }

  // 衝突用の剛体: 外周を凸な部品に分けた複合剛体。同じ階層の板どうしだけ衝突する。
  // 階層ごとに2ビット使う: 下のビットはねじの残った板、上のビットはねじ0本の板。ねじ0本どうしはぶつからない(落ちていく板が空中で弾き合わない)
  // 重心は実形状(穴を抜いた格子)の値に置き直し、質量と慣性モーメントも実形状の値にする
  const tierBit = tier => 1 << (tier % 15) * 2;
  function makeBody(g, x, y, ang, tier) {
    const poly = g.outline.map(([px, py]) => [px + x, py + y]);
    const toV = c => c.map(([px, py]) => ({ x: px, y: py }));
    let sets = [];
    try {
      decomp.makeCCW(poly);
      decomp.removeCollinearPoints(poly, 0.02);
      sets = decomp.quickDecomp(poly).filter(c => c.length >= 3).map(toV).filter(vs => Vertices.area(vs) > 4);
    } catch (e) { sets = []; }
    if (!sets.length) sets = [Vertices.hull(toV(poly))];
    const parts = sets.map(vs => Body.create({ position: Vertices.centre(vs), vertices: vs }));
    const bit = tierBit(tier);
    const body = Body.create({ parts, frictionAir: 0.012, friction: 0.2, collisionFilter: { group: 0, category: bit, mask: bit | bit << 1 } });
    Body.setCentre(body, { x, y });
    Body.setMass(body, g.area * DENSITY);
    Body.setInertia(body, g.inertia * DENSITY * INERTIA_SCALE);
    Body.setAngle(body, ang);
    return body;
  }

  // ---- ステージ構築 ----
  // ---- 遊び方(ステージ / ランダム) ----
  // ステージはステージ番号から決まる固定の盤面。ランダムは難しさを選び、毎回ちがう番号(種)で作る。
  // ランダムで遊んでもステージの到達点は変えない
  const DIFFS = [
    { name: 'やさしい', lv: 3 },
    { name: 'ふつう', lv: 8 },
    { name: 'むずかしい', lv: 16 },
  ];
  let cur = { mode: 'stage', lv: 1 }, stageLv = 1;
  const stageSeed = lv => lv * 7919 + 13;
  function newSeed() {
    try { return 100000 + crypto.getRandomValues(new Uint32Array(1))[0] % 900000; }
    catch (e) { return 100000 + Math.floor(Math.random() * 900000); }
  }
  function loadLevel(lv) {
    stageLv = lv;
    try { localStorage.setItem('screw-level', String(lv)); } catch (e) {}
    cur = { mode: 'stage', lv };
    build(lv, stageSeed(lv));
  }
  function loadRandom(diff, seed = newSeed()) {
    try { localStorage.setItem('screw-rand-diff', String(diff)); } catch (e) {}
    cur = { mode: 'random', diff, seed };
    build(DIFFS[diff].lv, seed);
  }
  const restart = () => cur.mode === 'stage' ? loadLevel(cur.lv) : loadRandom(cur.diff, cur.seed);
  function setTitle() {
    const main = document.getElementById('tMain'), sub = document.getElementById('tSub');
    if (cur.mode === 'stage') { main.textContent = `ステージ ${cur.lv}`; sub.hidden = true; }
    else { main.textContent = 'ランダム'; sub.textContent = `${DIFFS[cur.diff].name} #${cur.seed}`; sub.hidden = false; }
  }

  function build(lv, seed) {
    clearTimeout(finishTimer);
    ended = false;
    liveReset();
    flashBuf = 0;
    stuckT = 0; calmT = 0;
    engine = Engine.create();
    engine.gravity.y = 1.1;
    const data = genLevel(lv, seed);
    level = { plates: data.plates, list: data.screws, queue: data.queue.slice(), model: data.model };
    hist = [];
    play = { t: 0, hints: 0, rewinds: 0 };
    clearFx();
    hint = null;
    boardId++;

    planks = data.plates.map(pl => {
      const g = buildPlate(pl);
      const [wx, wy] = place(pl, g.mx, g.my);
      const body = makeBody(g, wx, wy, pl.ang, pl.tier);
      Body.setStatic(body, true);
      Composite.add(engine.world, body);
      return { body, tier: pl.tier, tint: pl.tint, path: g.path, holes: g.holes, f: g.f, rad: g.rad, screws: [], constraint: null, nudge: null, gone: false, vis: 1, cvis: 1 };
    });

    screws = data.screws.map((s, idx) => {
      const sc = {
        idx, plank: planks[s.pl], hole: s.hi, color: s.color, state: 'board',
        rot: (data.rnd() - 0.5) * 0.5 - planks[s.pl].body.angle,   // 十字は置いた時点でほぼ正立
        shake: 0, from: null, dest: null, t: 0,
      };
      sc.plank.screws.push(sc);
      return sc;
    });

    queue = data.queue.slice();
    boxes = new Array(ACTIVE).fill(null);
    buffer = new Array(BUF).fill(null);
    for (let i = 0; i < ACTIVE; i++) spawnBox(i);
    updateTop();
    planks.forEach(p => { p.vis = visible(p) ? 1 : 0; p.cvis = known(p) ? 1 : 0; });
    setTitle();
    document.getElementById('modal').hidden = true;
    updateHud();
  }

  function updateHud() {
    const off = screws.filter(s => s.state !== 'board').length;
    document.getElementById('pct').textContent = Math.round(off / screws.length * 100) + '%';
  }

  // ---- 座標 ----
  function holeWorld(p, i) {
    const h = p.holes[i];
    const r = rot(h.x, h.y, p.body.angle);
    return { x: p.body.position.x + r.x, y: p.body.position.y + r.y };
  }
  const ease = t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
  function boxY(b) {
    return BOX_Y - (1 - ease(b.enter)) * 120;
  }
  // 満杯になった箱の去り方: leave が 0→LID でフタが上から落ちて閉まり、LID→1 で箱ごと外側の上へ回りながら飛んでいく
  const LID = 0.4;
  const leaveTime = () => mega() ? 0.7 : full() ? 0.6 : 0.45;
  // 派手めは、フタが閉まったあと箱がひと跳ね(大きくなって戻る)してから、よく回って飛ぶ
  function boxLeave(b) {
    const lid = Math.min(1, b.leave / LID), fly = Math.max(0, (b.leave - LID) / (1 - LID));
    const bounce = lid < 0.75 ? (lid / 0.75) ** 2 : 1 - Math.sin((lid - 0.75) / 0.25 * Math.PI) * 0.12;
    const side = b.idx < (ACTIVE - 1) / 2 ? -1 : 1, big = mega();
    return {
      lidY: -(1 - bounce) * 50, lidA: Math.min(1, lid * 3),
      dx: side * fly * fly * 70, dy: -fly * fly * 190, rot: side * fly * (big ? 1.4 : 0.5), alpha: 1 - fly ** 3,
      sc: big ? 1 + 0.2 * Math.sin(Math.PI * Math.min(1, fly / 0.25)) : 1,
    };
  }
  function destPos(d) {
    if (d.kind === 'box') return { x: boxX(d.box.idx) + SLOT[d.slot][0], y: boxY(d.box) + SLOT[d.slot][1] };
    return { x: bufX(d.idx), y: BUF_Y };
  }
  function screwPos(s) {
    if (s.state === 'board') return holeWorld(s.plank, s.hole);
    if (s.state === 'fly') {
      const to = destPos(s.dest), e = ease(s.t);
      return {
        x: s.from.x + (to.x - s.from.x) * e,
        y: s.from.y + (to.y - s.from.y) * e - Math.sin(Math.PI * s.t) * 40,
      };
    }
    return destPos(s.dest);
  }

  // ---- 階層の見え方 ----
  // 最上階層 = ねじが残っている板のうち一番上の階層。そこから COLOR_DEPTH 段目までは板とねじの色が見えて触れる。
  // SHAPE_DEPTH 段目までは板の形だけ見える。最上階層の板が全部外れる(ねじ0本で落ち始める)と、見える範囲が下へずれる
  let topTier = 0;
  function updateTop() {
    let t = Infinity;
    for (const p of planks) if (p.screws.length) t = Math.min(t, p.tier);
    topTier = t;
  }
  const visible = p => p.tier - topTier < SHAPE_DEPTH;   // 板の形が見える
  const known = p => p.tier - topTier < COLOR_DEPTH;     // ねじの色が見えて触れる

  // ---- 遮蔽判定: 上の階層の板がねじに少しでも被っていたら外せない ----
  // fixedOnly: 動かない板(ねじ2本以上で固定)だけを見る。詰みを揺れが収まる前に決めるのに使う
  function isBlocked(s, fixedOnly) {
    const p = s.plank, c = holeWorld(p, s.hole);
    for (const q of planks) {
      if (q.gone || q.tier >= p.tier || (fixedOnly && !q.body.isStatic)) continue;
      const dx = c.x - q.body.position.x, dy = c.y - q.body.position.y;
      if (dx * dx + dy * dy > (q.rad + SR + 3) ** 2) continue;
      const l = rot(dx, dy, -q.body.angle);
      if (covers(q.f, l.x, l.y)) return true;
    }
    return false;
  }

  // ---- 箱 ----
  function spawnBox(i) {
    if (!queue.length) { boxes[i] = null; return; }
    const b = { idx: i, color: queue.shift(), reserved: 0, arrived: 0, items: [], enter: 0, leaving: false, leave: 0 };
    boxes[i] = b;
    pullFromBuffer(b);
  }
  // 同じ色の箱が2つ開いていたら、多く入っている方へ(早く満杯にして次の箱を出す)。解けるかの判定(makeSim, solveOrder)も同じ規則
  function openBoxFor(color) {
    let best = null;
    for (const b of boxes) if (b && !b.leaving && b.color === color && b.reserved < 3 && (!best || b.reserved > best.reserved)) best = b;
    return best;
  }
  function pullFromBuffer(b) {
    for (let k = 0; k < BUF; k++) {
      const s = buffer[k];
      if (s && s.state === 'buffer' && s.color === b.color && b.reserved < 3 && !b.leaving) {
        buffer[k] = null;
        launch(s, { kind: 'box', box: b, slot: b.reserved++ });
        b.items.push(s);
      }
    }
  }

  function launch(s, dest) {
    s.from = screwPos(s);
    s.dest = dest;
    s.state = 'fly';
    s.t = 0;
  }

  function arrive(s) {
    if (s.dest.kind === 'box') {
      s.state = 'box';
      const b = s.dest.box;
      b.arrived++;
      if (b.arrived === 3) { b.leaving = true; b.leave = 0; if (!quiet) { chime(); liveSay('good', 1.8); liveHop(14); } }
    } else {
      s.state = 'buffer';
      boxes.forEach(b => { if (b && !b.leaving) pullFromBuffer(b); });
    }
  }

  // ---- 板からねじを抜く ----
  // 板を支点 a(盤面に固定)で吊る。h は板の穴の今の位置
  function pin(p, a, h) {
    p.constraint = Constraint.create({
      pointA: { x: a.x, y: a.y },
      bodyB: p.body,
      pointB: { x: h.x - p.body.position.x, y: h.y - p.body.position.y },
      length: 0, stiffness: 0.9, damping: 0.05,
    });
    Composite.add(engine.world, p.constraint);
  }
  function detach(s) {
    const p = s.plank;
    p.screws = p.screws.filter(x => x !== s);
    p.nudge = null;
    if (p.constraint) { Composite.remove(engine.world, p.constraint); p.constraint = null; }
    if (p.screws.length === 1) {
      const r = p.screws[0];
      const w = holeWorld(p, r.hole);
      Body.setStatic(p.body, false);
      pin(p, w, w);
      // 重心が残ったねじのほぼ真上にある(倒立の釣り合い)と、物理的には倒れるはずでも静止したままになる。
      // 左右どちらかへゆっくり押し出して、ひっくり返らせる。重心が少しでもずれていればその向きへ
      const dx = p.body.position.x - w.x, dy = p.body.position.y - w.y, d = len(dx, dy);
      if (d > 5 && dy < 0 && Math.abs(dx) < 0.25 * d) {
        const dir = Math.abs(dx) > 1 ? Math.sign(dx) : (Math.random() < 0.5 ? -1 : 1);
        p.nudge = { dir, a0: p.body.angle, t: 0 };
      }
    } else if (p.screws.length === 0) {
      Body.setStatic(p.body, false);
      // ねじ0本の板は落ちていき、同じ階層でねじの残った板に当たれば引っかかる。ねじ0本どうしはすり抜ける
      const bit = tierBit(p.tier);
      p.body.collisionFilter.category = bit << 1;
      p.body.collisionFilter.mask = bit;
    }
  }

  // 物理1ステップごとに、押し出し中の板の回転速度を下支えする
  // 打つ手が無い間(待機スロットが満杯で、入れられるねじが外せない)は、ぶら下がった板の揺れに強いブレーキをかける。
  // 止まる位置は変わらず、止まるまでが速くなる。大きな板は揺れが収まるまで6〜7秒かかり、その間は詰みを決められなかった。
  // ねじが外せるようになれば calming が外れて、ふだんの揺れに戻る
  let calming = false, calmT = 0;   // calmT: 打つ手が無い状態が続いている秒数
  const CALM_WAIT = 2;   // これだけ続いて、速く動く板も無ければ、止まりきるのを待たずに詰みにする(寄りかかった板のずり落ちは止まるまで長い)
  // 速く動いている板が無いか: ぶら下がった板は角速度 0.004 未満、ねじ0本の板は盤面の下へ抜けたか、速さ 0.5 未満かつ角速度 0.004 未満
  // (落ちている最中の板や、角を支点に傾いていく板は待つ。重心がほとんど動かなくても速く回っていることがある)
  function slow() {
    return planks.every(p => p.gone || p.body.isStatic || (p.screws.length ? Math.abs(p.body.angularVelocity) < 0.004
      : p.body.position.y - p.rad > BOARD.y1 || (p.body.speed < 0.5 && Math.abs(p.body.angularVelocity) < 0.004)));
  }
  const CALM = 0.93;   // 1ステップごとに速さへ掛ける率(0.93^60 ≈ 0.013、1秒でほぼ止まる)
  function calmStep() {
    if (!calming) return;
    for (const p of planks) {
      if (!p.constraint || p.nudge) continue;
      const b = p.body;
      Body.setVelocity(b, { x: b.velocity.x * CALM, y: b.velocity.y * CALM });
      Body.setAngularVelocity(b, b.angularVelocity * CALM);
    }
  }
  function nudgeStep() {
    for (const p of planks) {
      const n = p.nudge;
      if (!n) continue;
      n.t += STEP;
      if (Math.abs(p.body.angle - n.a0) > NUDGE_ANGLE || n.t > 4000) { p.nudge = null; continue; }
      if (n.dir * p.body.angularVelocity < NUDGE_W) Body.setAngularVelocity(p.body, n.dir * NUDGE_W);
    }
  }

  // ねじの行き先を確保する: 合う箱、無ければ待機スロット。どちらも無ければ null
  function claim(s) {
    const b = openBoxFor(s.color);
    if (b) {
      b.items.push(s);
      return { kind: 'box', box: b, slot: b.reserved++ };
    }
    const k = buffer.indexOf(null);
    if (k < 0) return null;
    buffer[k] = s;
    return { kind: 'buf', idx: k };
  }
  function tapScrew(s) {
    if (!known(s.plank) || isBlocked(s)) { s.shake = 0.3; buzz(); return; }
    if (!openBoxFor(s.color) && !buffer.includes(null)) { flashBuf = 0.45; buzz(); return; }
    hist.push({ i: s.idx, phys: snapPhys() });
    const dest = claim(s);
    const from = holeWorld(s.plank, s.hole);
    detach(s);
    s.state = 'board';
    launch(s, dest);
    s.from = from;
    updateHud();
    click();
    vibe(18, 12);
    liveHop(s.plank.screws.length ? 5 : 11);     // 板が落ちる手は大きく跳ねる
  }

  // ---- 戻る ----
  // 外す直前の板の状態(位置、角度、速さ、固定か、支点、押し出し中か)
  function snapPhys() {
    return planks.map(p => {
      const b = p.body;
      return {
        x: b.position.x, y: b.position.y, a: b.angle, vx: b.velocity.x, vy: b.velocity.y, w: b.angularVelocity,
        stat: b.isStatic, cat: b.collisionFilter.category, mask: b.collisionFilter.mask, gone: p.gone,
        pin: p.constraint ? { x: p.constraint.pointA.x, y: p.constraint.pointA.y } : null,
        nudge: p.nudge ? { ...p.nudge } : null,
      };
    });
  }
  // 飛んでいるねじと出入りしている箱を、動きなしで行き着かせる
  function settleNow() {
    for (let guard = 0; guard < 500; guard++) {
      let busy = false;
      for (const s of screws) if (s.state === 'fly') { s.t = 1; arrive(s); busy = true; }
      for (let i = 0; i < ACTIVE; i++) {
        const b = boxes[i];
        if (!b) continue;
        b.enter = 1;
        if (b.leaving) { b.items.forEach(x => { x.state = 'done'; }); spawnBox(i); busy = true; }
      }
      if (!busy) return;
    }
  }
  // k 手目を外す直前へ戻す。ねじと箱は最初の並びから k 手を動きなしで入れ直し、板は記録した状態に置き直す
  function rewindTo(k) {
    clearTimeout(finishTimer);
    clearFx();
    ended = false; stuckT = 0; calmT = 0; flashBuf = 0;
    live.end = null;
    document.getElementById('modal').hidden = true;
    quiet = true;
    for (const p of planks) p.screws = [];
    for (const s of screws) { s.state = 'board'; s.dest = null; s.from = null; s.t = 0; s.shake = 0; s.plank.screws.push(s); }
    queue = level.queue.slice();
    boxes = new Array(ACTIVE).fill(null);
    buffer = new Array(BUF).fill(null);
    for (let i = 0; i < ACTIVE; i++) spawnBox(i);
    settleNow();
    for (let j = 0; j < k; j++) {
      const s = screws[hist[j].i], dest = claim(s);
      s.plank.screws = s.plank.screws.filter(x => x !== s);
      launch(s, dest);
      settleNow();
    }
    quiet = false;
    const snap = hist[k].phys;
    planks.forEach((p, n) => {
      const r = snap[n], b = p.body;
      if (p.constraint) { Composite.remove(engine.world, p.constraint); p.constraint = null; }
      if (r.gone) {
        if (!p.gone) Composite.remove(engine.world, b);
        p.gone = true;
        return;
      }
      if (p.gone) { Composite.add(engine.world, b); p.gone = false; }
      if (b.isStatic !== r.stat) Body.setStatic(b, r.stat);
      Body.setPosition(b, { x: r.x, y: r.y });
      Body.setAngle(b, r.a);
      if (!r.stat) { Body.setVelocity(b, { x: r.vx, y: r.vy }); Body.setAngularVelocity(b, r.w); }
      b.collisionFilter.category = r.cat;
      b.collisionFilter.mask = r.mask;
      if (r.pin && p.screws.length === 1) pin(p, r.pin, holeWorld(p, p.screws[0].hole));
      p.nudge = r.nudge ? { ...r.nudge } : null;
    });
    hist.length = k;
    updateTop();
    planks.forEach(p => { p.vis = visible(p) ? 1 : 0; p.cvis = known(p) ? 1 : 0; });
    updateHud();
  }
  // 戻る先: 見積もりの上で解ける手順が残っている一番新しい局面。0 手目(最初)は生成のときに解けると確かめてあり、
  // 今の局面は詰んでいるので解けないとみなす。解けるかは手数についてほぼ単調なので二分探索する。
  // 見積もりは安全側なので、戻る先は「確実に解ける局面」で、本当の分かれ目より手前になることがある
  async function rewindPoint(id) {
    const moves = hist.map(h => h.i);
    let lo = 0, hi = moves.length;
    while (hi - lo > 1) {
      const mid = (lo + hi) >> 1;
      await new Promise(r => setTimeout(r, 0));    // 1回ずつ画面に返す
      if (id !== boardId) return null;
      if (solveFull(level.plates, level.list, level.queue, level.model, SOLVE_BUDGET, moves.slice(0, mid))) lo = mid; else hi = mid;
    }
    return lo;
  }
  async function rewind() {
    const btn = document.getElementById('mUndo'), id = boardId;
    btn.disabled = true;
    btn.textContent = '戻る先を探しています…';
    await new Promise(r => setTimeout(r, 30));
    const k = await rewindPoint(id);
    btn.disabled = false;
    if (k === null || id !== boardId) return;
    const back = hist.length - k, fork = screws[hist[k].i];
    rewindTo(k);
    play.rewinds++;
    hint = { s: fork, t: 4, go: false };
    toast(k ? `${back}手戻した。赤い輪のねじが分かれ目` : '最初まで戻した。赤い輪のねじが分かれ目', 'oopsFace');
    liveSay('oops', 2.5);
  }
  // ヒント: 今の局面から解ける手順を探し、その最初の手のねじに金色の輪を出す(使うと評価が下がる)
  async function showHint() {
    const btn = document.getElementById('hintBtn'), id = boardId;
    if (ended || btn.disabled) return;
    btn.disabled = true;
    await new Promise(r => setTimeout(r, 20));
    const path = id === boardId ? solveFull(level.plates, level.list, level.queue, level.model, SOLVE_BUDGET, hist.map(h => h.i)) : null;
    btn.disabled = false;
    if (id !== boardId || ended || (path && !path.length)) return;   // 外し終えてクリアの画面を待っているところ
    if (!path) { toast('ここからは解ける手順が見つからない。詰んだら「解ける所まで戻る」が使える', 'oopsFace'); liveSay('oops', 2.5); return; }
    const s = screws[path[0]];
    hint = { s, t: 5, go: true };
    play.hints++;
    toast(known(s.plank) && !isBlocked(s) ? '金色の輪のねじが次の一手' : '次は金色の輪（揺れが収まってから）', 'ideaFace');
    liveSay('idea', 3);
  }
  // ---- キャラ ----
  // 画像は assets/chara/ に置く(scripts/prep_chara.py が art/chara/ の原画から作る)。
  // 起動時に読み込んでおき、場面ごとに差し替える。読めなかったときは出さない(単体で開いたページなど)
  const CHARA = {
    idle: 'idle.webp', clear: 'clear.webp', good: 'good.webp', oops: 'oops.webp', cry: 'cry.webp', idea: 'idea.webp',   // 全身
    panic: 'panic.webp', fight: 'fight.webp',
    ideaFace: 'idea-face.webp', oopsFace: 'oops-face.webp', smileFace: 'smile-face.webp', goodFace: 'good-face.webp', fightFace: 'fight-face.webp',   // 丸い顔
  };
  const charaOk = {}, charaImg = {};
  for (const k in CHARA) {
    const im = new Image();
    im.onload = () => { charaOk[k] = im.src; charaImg[k] = im; };
    im.src = 'assets/chara/' + CHARA[k];
  }
  // 付け直して、出てくる動きを最初から
  function showChara(img, k, anim) {
    img.classList.remove('in', 'hop', 'sag');
    img.hidden = !charaOk[k];
    if (img.hidden) return;
    img.src = charaOk[k];
    void img.offsetWidth;
    if (anim) img.classList.add(anim);
  }

  // ---- 盤面の脇のキャラ ----
  // 箱の列の右、設定の歯車の下に立つ。板より先(奥)に描くので、揺れた板が重なれば板の方が手前になる。
  // 表情はふだん待機スロットの埋まり具合で決まり(4つで焦り顔、5つで涙)、出来事があるとしばらく上書きする。
  // 盤面を読み込んだときは、やる気顔でひと跳ねして出てくる。
  // 動き: ふだんは小さく揺れ、ねじを外すと小さく、板が落ちたり箱が埋まったりすると大きく跳ねる。
  // 端末が「動きを減らす」設定なら、揺れも跳ねも無しで表情だけ変える
  const LIVE = { x: 357, foot: 160, h: 108 };   // 盤面の座標: 立ち位置の中心、足元の高さ、背の高さ(いちばん幅の広い絵で 314〜400)
  const HOP = 0.42;                              // 1回跳ねる時間(秒)
  const live = { t: 0, say: null, sayT: 0, end: null, shown: null, popT: 1, hopT: HOP, hopAmp: 0, hops: 0 };
  const liveCache = {};                           // 表情ごとに、今の画面の画素数へ縮めておいた絵
  function liveReset() {
    Object.assign(live, { say: null, sayT: 0, end: null, hopT: HOP, hops: 0 });
    liveSay('fight', 1.6);
    liveHop(10);
  }
  function liveSay(face, sec) { live.say = face; live.sayT = sec; }
  function liveHop(amp, n = 1) {
    if (live.hopT < HOP && amp < live.hopAmp) return;      // 大きく跳ねている途中は、小さい跳ねで遮らない
    live.hopAmp = amp; live.hopT = 0; live.hops = n - 1;
  }
  function liveFace() {
    if (live.end) return live.end;

  }
  function updateLive(dt) {
    live.t += dt; live.popT += dt; live.hopT += dt;

  }
  function liveImage(face) {
    const im = charaImg[face];
    if (!im) return null;
    const px = scale * dpr;
    let c = liveCache[face];
    if (!c || c.px !== px) {                      // 毎フレーム大きな絵を縮めると粗くて重いので、画面の画素数で一度だけ縮める
      const h = LIVE.h, w = h * im.naturalWidth / im.naturalHeight;
      const off = document.createElement('canvas');
      off.width = Math.max(1, Math.round(w * px));
      off.height = Math.max(1, Math.round(h * px));
      const g = off.getContext('2d');
      g.imageSmoothingQuality = 'high';
      g.drawImage(im, 0, 0, off.width, off.height);
      c = liveCache[face] = { cv: off, w, h, px };
    }
    return c;
  }
  const outBack = u => 1 + 2.7 * Math.pow(u - 1, 3) + 1.7 * Math.pow(u - 1, 2);
  function drawLive() {
    const face = liveFace();
    if (face !== live.shown) { live.shown = face; live.popT = 0; }
    const c = liveImage(face);
    if (!c) return;
    let y = 0, rot = 0, sx = 1, sy = 1;
    if (full()) {
      const sad = face === 'cry' || face === 'oops' || face === 'panic';
      y = Math.sin(live.t * (sad ? 1.7 : 2.6)) * (sad ? 1.2 : 2.2);
      rot = Math.sin(live.t * (sad ? 0.9 : 1.3)) * (sad ? 0.02 : 0.045);
      if (face === 'cry') rot += Math.sin(live.t * 24) * 0.012;       // すすり泣きの震え
      if (face === 'panic') rot += Math.sin(live.t * 34) * 0.008;     // 身をすくめて小刻みに震える
      if (live.hopT < HOP) {
        const u = live.hopT / HOP;
        y -= live.hopAmp * 4 * u * (1 - u);
        const q = u < 0.18 ? 1 - u / 0.18 : u > 0.82 ? (u - 0.82) / 0.18 : 0;   // 踏み切りと着地でつぶれる
        sx = 1 + 0.07 * q; sy = 1 - 0.07 * q;
      }
      if (live.popT < 0.32) {                                        // 表情が変わったら、ぽんと出る
        const k = 0.86 + 0.14 * outBack(live.popT / 0.32);
        sx *= k; sy *= k;
      }
    }
    ctx.save();
    ctx.translate(LIVE.x, LIVE.foot + y);
    ctx.rotate(rot);
    ctx.scale(sx, sy);
    ctx.drawImage(c.cv, -c.w / 2, -c.h, c.w, c.h);
    ctx.restore();
  }

  let toastTimer = null;
  function toast(msg, face) {
    const t = document.getElementById('toast');

  }

  // ---- 入力 ----
  cv.addEventListener('pointerdown', e => {
    if (ended) return;

    for (const s of screws) {
      if (s.state !== 'board' || !visible(s.plank)) continue;

  const $ = id => document.getElementById(id);
  $('retry').addEventListener('click', restart);
  $('mUndo').addEventListener('click', rewind);
  $('hintBtn').addEventListener('click', showHint);
  $('mBtn').addEventListener('click', () => {

  $('mBack').addEventListener('click', () => loadLevel(stageLv));
  // サイコロ: 難しさを選んでランダムな盤面へ
  const pickBtns = [...document.querySelectorAll('.pickbtn[data-diff]')];
  const PICK_FACE = ['smileFace', 'goodFace', 'fightFace'];   // やさしいは笑顔、ふつうはウインク、むずかしいはやる気顔
  pickBtns.forEach(b => {

  $('dice').addEventListener('click', () => {

  $('pickBack').addEventListener('click', () => { $('pick').hidden = true; loadLevel(stageLv); });
  $('pickClose').addEventListener('click', () => { $('pick').hidden = true; });
  // 設定: 演出の強さ。選んだら、その強さで音と振動を1回鳴らして違いが分かるようにする
  const fxBtns = [...document.querySelectorAll('.fxbtn')];
  const showFx = () => fxBtns.forEach(b => b.classList.toggle('on', b.dataset.fx === fxLevel));
  fxBtns.forEach(b => b.addEventListener('click', () => {
    fxLevel = b.dataset.fx;

    showFx();

  }));
  $('gear').addEventListener('click', () => { showFx(); $('settings').hidden = false; });
  $('setClose').addEventListener('click', () => { $('settings').hidden = true; });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') { $('pick').hidden = true; $('settings').hidden = true; } });

  // ---- 演出の強さ(設定) ----
  // 'low' = 控えめ: クラッカー2発と紙吹雪、光、あとからの紙吹雪、ファンファーレに和音とキラキラ。
  // 'high' = 派手め: さらにクラッカー4発、花火、コインの雨、リボン、画面の揺れと虹色の光、太鼓とシンバル、箱が跳ねて星の尾を引く。
  // (2026-09-27 に組み替え: それまでの「派手め」を「控えめ」にし、その上を作った。それまでの「控えめ」は無くした)
  // 振動もこれに従う。端末が「動きを減らす」設定なら、揺れ・光・花火は出さず、紙吹雪も少なくする
  let fxLevel = 'high';
  try { const v = localStorage.getItem('screw-fx'); if (v === 'low' || v === 'high') fxLevel = v; } catch (e) {}
  const reduceMotion = (() => { try { return matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; } })();
  const full = () => !reduceMotion;                       // 控えめ以上の演出を出すか
  const mega = () => fxLevel === 'high' && !reduceMotion;   // 派手めの演出を出すか
  function vibe(high, low) {                // 振動(派手め / 控えめ のパターン)
    try { navigator.vibrate && navigator.vibrate(fxLevel === 'high' ? high : low); } catch (e) {}
  }

  // ---- 音 ----
  // どれもその場で合成する(音声ファイルは使わない)。演出の強さで重ねる音の数が変わる
  let actx = null;
  const audio = () => {
    try { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); return actx; } catch (e) { return null; }
  };
  function tone(f, d, type, v, slide, at = 0) {
    const A = audio();
    if (!A) return;
    try {
      const t0 = A.currentTime + at;
      const o = A.createOscillator(), g = A.createGain();
      o.type = type;
      o.frequency.setValueAtTime(f, t0);
      o.frequency.exponentialRampToValueAtTime(f * slide, t0 + d);
      g.gain.setValueAtTime(v, t0);
      g.gain.exponentialRampToValueAtTime(0.001, t0 + d);
      o.connect(g).connect(A.destination);
      o.start(t0); o.stop(t0 + d);
    } catch (e) {}
  }
  // ざっという音(白色雑音を帯域で絞る)。f0 から f1 へ帯域を動かす
  let noiseBuf = null;
  function noise(d, f0, f1, v, at = 0) {
    const A = audio();
    if (!A) return;
    try {
      if (!noiseBuf) {
        noiseBuf = A.createBuffer(1, A.sampleRate, A.sampleRate);
        const ch = noiseBuf.getChannelData(0);
        for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1;
      }
      const t0 = A.currentTime + at;
      const src = A.createBufferSource(), bp = A.createBiquadFilter(), g = A.createGain();
      src.buffer = noiseBuf;
      bp.type = 'bandpass'; bp.Q.value = 1.2;
      bp.frequency.setValueAtTime(f0, t0);
      bp.frequency.exponentialRampToValueAtTime(f1, t0 + d);
      g.gain.setValueAtTime(v, t0);
      g.gain.exponentialRampToValueAtTime(0.001, t0 + d);
      src.connect(bp).connect(g).connect(A.destination);
      src.start(t0); src.stop(t0 + d);
    } catch (e) {}
  }
  const click = () => tone(620, 0.07, 'triangle', 0.18, 1.8);
  const buzz = () => tone(140, 0.12, 'square', 0.06, 0.8);
  const chime = () => { tone(880, 0.12, 'sine', 0.14, 1.0); tone(1320, 0.16, 'sine', 0.12, 1.0, 0.09); };
  const lidClack = () => tone(980, 0.05, 'square', 0.07, 0.6);          // 箱のフタが閉まる

  const popSound = () => { noise(0.16, 2600, 900, 0.9); tone(150, 0.14, 'sine', 0.5, 0.45); };   // クラッカー
  // ファンファーレ: 上がっていく4音に和音とキラキラ。at 秒後に始める。派手めは、前に太鼓の連打、頭にシンバル、あとにもうひと節

    N.forEach(f => tone(f, 1.1, 'sine', 0.07, 1.0, at + 0.5));
    for (let k = 0; k < 9; k++) tone(1800 + Math.random() * 1600, 0.07, 'sine', 0.06, 1.3, at + 0.45 + Math.random() * 1.0);
    if (!big) return;
    [783.99, 1046.5, 1318.5, 1568].forEach((f, i) => tone(f, 0.2, 'triangle', 0.18, 1.0, at + 1.0 + i * 0.09));

  }
  const boom = at => { noise(0.55, 260, 60, 0.9, at); for (let k = 0; k < 7; k++) noise(0.05, 5000, 3000, 0.12, at + 0.25 + Math.random() * 0.5); };   // 花火
  const coinTick = () => tone(1500 + Math.random() * 500, 0.08, 'sine', 0.1, 1.6);   // コインが届いた
  const bling = () => { tone(1320, 0.12, 'sine', 0.12, 1.0); tone(1760, 0.18, 'sine', 0.1, 1.0, 0.07); };      // 派手め: フタが閉まったとき

  // ---- 進行 ----
  function idle() {
    return !screws.some(s => s.state === 'fly') && boxes.every(b => !b || (!b.leaving && b.enter >= 1));
  }
  // 盤面が落ち着いているか: 落ちていく板は盤面の下へ抜けるか、どこかに引っかかって止まり、ぶら下がった板の揺れもほぼ止まっている。
  // 落ちる途中や揺れている途中の板は一瞬だけねじを隠すことがあるので、詰みの判定は落ち着いてから行う
  // 閾値は小さな揺れも拾う大きさ(角速度 0.001 rad/ステップは、大きな板の振れ幅で1度あまり)。

  function settled() {
    const still = p => p.body.speed < 0.04 && Math.abs(p.body.angularVelocity) < 0.001;
    return planks.every(p => p.gone || p.body.isStatic ||
      (p.screws.length ? Math.abs(p.body.angularVelocity) < 0.001 : p.body.position.y - p.rad > BOARD.y1 || still(p)));
  }
  function canMove() {
    if (buffer.includes(null)) return true;

  // 揺れや落下を待っても手が出ないか: 待機スロットが満杯で、合う箱のあるねじがどれも動かない板に隠れている。

  function hopeless() {

  }
  // ---- クリアの評価 ----
  // ★3 から、ヒント1回ごと・戻る1回ごとに1つ減らし、目安の時間(ねじの本数 × PAR_PER_SCREW 秒)を超えたらもう1つ減らす。最低 ★1
  const clock = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
  function rate() {

  // ステージごとの自己ベスト(星が多い方、同じ星なら速い方)。ランダムは毎回ちがう盤面なので残さない
  function saveBest(r) {
    if (cur.mode !== 'stage') return null;

    try { all = JSON.parse(localStorage.getItem('screw-best') || '{}') || {}; } catch (e) {}
    const old = all[cur.lv] || null, t = Math.round(play.t * 10) / 10;   // 比べる値と残す値を同じ 0.1 秒単位にそろえる
    const better = !old || r.stars > old.stars || (r.stars === old.stars && t < old.t);
    if (better) {

  }
  function showRating() {

    const lines = [`時間 ${clock(play.t)}（目安 ${clock(r.par)}）`, `ヒント ${play.hints}回・戻る ${play.rewinds}回`];
    if (best) lines.push(best.old && !best.better ? `自己ベスト ${'★'.repeat(best.old.stars)}${'☆'.repeat(3 - best.old.stars)} ${clock(best.old.t)}` : '自己ベスト更新');

  // 勝ち負けの画面は少し遅れて出す。その間に別の盤面を読み込んだら取り消す(build で clearTimeout)
  let finishTimer = null;
  function finish(won) {

        ? (rand ? `ランダム（${DIFFS[cur.diff].name}）#${cur.seed} の板を全部落とした` : `ステージ ${cur.lv} の板を全部落とした`)

  }

  function update(dt) {
    updateLive(dt);
    if (flashBuf > 0) flashBuf = Math.max(0, flashBuf - dt);
    updateTop();
    for (const p of planks) {             // 新しく見えた板やねじの色はふわっと出す
      const k = Math.min(1, dt * 5);
      p.vis += ((visible(p) ? 1 : 0) - p.vis) * k;
      p.cvis += ((known(p) ? 1 : 0) - p.cvis) * k;
    }
    for (const s of screws) {
      if (s.shake > 0) s.shake = Math.max(0, s.shake - dt);
    }
    if (hint && ((hint.t -= dt) <= 0 || hint.s.state !== 'board')) hint = null;
    // 遊んだ時間: クリアや詰みの画面、設定や難しさ選びを開いている間は数えない
    if (!ended && document.getElementById('settings').hidden && document.getElementById('pick').hidden) play.t += dt;
    for (const s of screws) {
      if (s.state === 'fly') {
        s.t += dt / FLY;

    }
    for (let i = 0; i < ACTIVE; i++) {

        if (was < LID + 0.05 && b.leave >= LID + 0.05 && full()) whoosh();
        if (mega() && b.leave > LID) {         // 飛んでいく箱が星の尾を引く
          const L = boxLeave(b);
          trail(boxX(i) + L.dx, BOX_Y + L.dy);
        }
        if (b.leave >= 1) {
          b.items.forEach(s => { s.state = 'done'; });

        }

    for (const p of planks) {
      if (!p.gone && p.body.position.y > H + 320) {
        p.gone = true;

      }

    // ぶら下がった板は揺れの折り返しで一瞬止まるので、その瞬間だけで決めない
    let stuckNow = false;

    if (!ended && idle()) {
      const onBoard = screws.some(s => s.state === 'board');
      if (!onBoard && !queue.length && boxes.every(b => !b)) finish(true);

  // ---- 描画 ----
  function rr(x, y, w, h, r) {
    ctx.beginPath();

    ctx.arcTo(x + w, y + h, x, y + h, r);

    ctx.beginPath(); ctx.arc(0, 0, SR, 0, TAU); ctx.fillStyle = C.d; ctx.fill();
    ctx.beginPath(); ctx.arc(0, 0, SR - 2, 0, TAU); ctx.fillStyle = C.g; ctx.fill();
    ctx.lineCap = 'round';

    ctx.save(); ctx.translate(0.5, 0.9); ctx.rotate(a); crossPath(5.2); ctx.strokeStyle = C.m; ctx.lineWidth = 2; ctx.stroke(); ctx.restore();
    ctx.restore();
  }
  // 色の分からないねじ(形だけ見える階層)。銀色のねじと見分けがつくよう、色の無い暗い影で描く
  function drawBlank(x, y, a) {
    ctx.save();

    rr(x - 50, y - 29, 100, 78, 17); ctx.fillStyle = C.d; ctx.fill();     // 底の厚み
    rr(x - 50, y - 34, 100, 78, 17); ctx.fillStyle = C.c; ctx.fill();
    rr(x - 46, y - 31, 92, 18, 9); ctx.fillStyle = 'rgba(255,255,255,0.25)'; ctx.fill();
    rr(x - 41, y - 25, 82, 57, 12); ctx.fillStyle = '#f4f2f7'; ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(0,0,0,0.12)'; ctx.stroke();

  // ---- 紙吹雪とクラッカー ----
  // 画面全体に重ねた透明なキャンバス(#fx)に描く。座標は画面の CSS ピクセル。クリアの画面の上にも、上のコインの所にも描ける
  const fxc = document.getElementById('fx'), fxx = fxc.getContext('2d');
  let parts = [], poppers = [], flash = 0, flashHue = -1, fxW = 0, fxH = 0, fxDirty = false, celebTimers = [];

  const coinEl = () => document.querySelector('#prog .coin');

  function clearFx() {

  const later = (sec, f) => celebTimers.push(setTimeout(f, sec * 1000));
  const rnd01 = () => Math.random();

    rot: rnd01() * TAU, vr: (rnd01() - 0.5) * 14, flip: rnd01() * TAU, ph: rnd01() * TAU,
    w: 6 + rnd01() * 5, h: 9 + rnd01() * 7, c, t: 0, life: 7, g });

  function trail(x, y) {

      rot: rnd01() * TAU, vr: 5, size: 3 + rnd01() * 4, c: k ? '#ffe27a' : '#ffffff', t: 0, life: 0.5 + rnd01() * 0.3, g: 0 });

  function burst(x, y, ang, n, colors) {
    const sp = Math.min(fxW, fxH);
    for (let k = 0; k < n; k++) {
      const a = ang + (rnd01() - 0.5) * 0.8, v = sp * (1.9 + rnd01() * 1.3);

  function firework(x, y, c) {

      const a = k / n * TAU + rnd01() * 0.1, v = 170 + rnd01() * 150;

  function coinShower(n) {
    const r = coinEl().getBoundingClientRect(), tx = r.left + r.width / 2, ty = r.top + r.height / 2;
    const b = cv.getBoundingClientRect();
    for (let k = 0; k < n; k++) {

  }
  // 派手め: 上から降るリボン

    for (let k = 0; k < n; k++) parts.push({ kind: 'ribbon', x: rnd01() * fxW, y: -40 - rnd01() * 160, vx: (rnd01() - 0.5) * 40, vy: 60 + rnd01() * 60,
      ph: rnd01() * TAU, len: 50 + rnd01() * 40, c: colors[k % colors.length], t: 0, life: 7, g: 0.12, rot: 0, vr: 0 });

    if (full()) later(1.1, () => { for (let k = 0; k < 50; k++) parts.push(paper(rnd01() * fxW, -20 - rnd01() * 120, (rnd01() - 0.5) * 60, 40 + rnd01() * 80, colors[k % colors.length], 0.35)); });
